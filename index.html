<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root{
    --paper:#F6F7F4; --surface:#FFFFFF; --surface-2:#EFF2EE;
    --ink:#191F1C; --muted:#5E6B64; --faint:#8A968F;
    --rule:#DCE1DC; --rule-fuerte:#C3CBC5;
    --acento:#1E5C48; --acento-ink:#164435; --acento-suave:#E3EDE7;
    --alerta:#9A2B24; --alerta-suave:#F6E7E5;
    --aviso:#7E5510; --aviso-suave:#F5EDDD;
    --ok:#2E6B3E; --ok-suave:#E6F0E6;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    --mono:"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
    --sombra:0 1px 2px rgba(25,31,28,.06), 0 12px 28px -20px rgba(25,31,28,.4);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#111512; --surface:#181E1B; --surface-2:#1F2723;
      --ink:#E7EDE9; --muted:#98A49D; --faint:#77837C;
      --rule:#293230; --rule-fuerte:#3A4642;
      --acento:#6CC6A2; --acento-ink:#8FD8BA; --acento-suave:#1B302A;
      --alerta:#E39089; --alerta-suave:#341E1C;
      --aviso:#D6A85A; --aviso-suave:#302719;
      --ok:#7FBF8C; --ok-suave:#1B2A1E;
      --sombra:0 1px 2px rgba(0,0,0,.5), 0 12px 28px -20px rgba(0,0,0,.9);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;}
  button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--acento);outline-offset:2px;}

  /* ---------------- cabecera ---------------- */
  header{
    background:var(--surface);border-bottom:1px solid var(--rule-fuerte);
    padding:9px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    position:sticky;top:0;z-index:30;
  }
  .marca{font-weight:700;letter-spacing:-.01em;line-height:1.15;}
  .marca small{display:block;font-weight:400;font-size:10.5px;color:var(--muted);
               letter-spacing:.08em;text-transform:uppercase;}
  nav.menu{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap;}
  nav.menu button{
    background:transparent;border:1px solid transparent;border-radius:4px;
    padding:7px 12px;color:var(--muted);min-height:38px;
  }
  nav.menu button:hover{background:var(--surface-2);color:var(--ink);}
  nav.menu button[aria-current="page"]{
    background:var(--acento-suave);color:var(--acento-ink);border-color:var(--acento);font-weight:600;
  }
  .yo{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);white-space:nowrap;}
  .build{font-family:var(--mono);font-size:10.5px;color:var(--faint);}

  /* ---------------- controles ---------------- */
  select,input[type=date],input[type=text],input[type=time],input[type=number],input[type=email],textarea{
    padding:7px 9px;background:var(--surface);border:1px solid var(--rule-fuerte);
    border-radius:4px;min-height:38px;max-width:100%;
  }
  textarea{min-height:70px;resize:vertical;line-height:1.45;}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px;}
  .campo{margin-bottom:12px;}
  .campo .ayuda{font-size:12px;color:var(--faint);margin-top:3px;}
  .fila{display:flex;gap:12px;flex-wrap:wrap;}
  .fila > *{flex:1 1 150px;min-width:0;}

  .btn{
    background:var(--surface);border:1px solid var(--rule-fuerte);border-radius:4px;
    padding:8px 14px;min-height:38px;font-weight:500;
  }
  .btn:hover{background:var(--surface-2);}
  .btn.principal{background:var(--acento);border-color:var(--acento);color:#fff;}
  .btn.principal:hover{filter:brightness(1.08);}
  .btn.peligro{color:var(--alerta);border-color:var(--alerta);}
  .btn.chico{padding:4px 9px;min-height:30px;font-size:13px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}
  .nav-fechas{display:flex;}
  .nav-fechas .btn{border-radius:0;margin-left:-1px;}
  .nav-fechas .btn:first-child{border-radius:4px 0 0 4px;margin-left:0;}
  .nav-fechas .btn:last-child{border-radius:0 4px 4px 0;}

  /* ---------------- estructura ---------------- */
  .barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
         padding:12px 16px;border-bottom:1px solid var(--rule);background:var(--surface);}
  .sello{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--faint);}
  main{padding:16px;max-width:1000px;margin:0 auto;}
  h1{font-size:19px;margin:0;font-weight:600;}
  h2{font-size:16px;margin:0 0 10px;font-weight:600;}
  .subtitulo{font-size:13px;color:var(--muted);}
  .encabezado{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;
              margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--rule);}
  .encabezado .der{margin-left:auto;}
  section.bloque{background:var(--surface);border:1px solid var(--rule);border-radius:6px;
                 padding:16px;margin-bottom:16px;}
  section.bloque > h2{display:flex;align-items:center;gap:10px;}
  section.bloque > h2 .der{margin-left:auto;font-weight:400;}

  /* ---------------- grilla de agenda ---------------- */
  .grilla{display:flex;flex-direction:column;border:1px solid var(--rule);
          background:var(--surface);border-radius:6px;overflow:hidden;}
  .franja{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;
          padding:9px 12px;border-bottom:1px solid var(--rule);}
  .franja:last-child{border-bottom:0;}
  .franja .h{font-family:var(--mono);font-size:13px;color:var(--muted);
             font-variant-numeric:tabular-nums;}
  .franja .quien b{font-weight:600;}
  .franja .quien span{display:block;font-size:12.5px;color:var(--muted);}
  .franja .vacio{color:var(--faint);font-style:italic;}
  .franja.sobre{background:var(--aviso-suave);border-left:3px solid var(--aviso);}
  .franja.sobre .h::before{content:"+ ";color:var(--aviso);font-weight:700;}
  /* Una fila en la que se puede hacer algo tiene que parecerlo, y tiene que
     poder usarse con el teclado: en un mostrador se trabaja más rápido con
     tabulador y Enter que buscando el mouse. */
  .franja.clicable{cursor:pointer;}
  .franja.clicable:hover{background:var(--acento-suave);}
  .franja.clicable:focus-visible{outline:2px solid var(--acento);outline-offset:-2px;}
  .franja.recien{animation:destello 1.6s ease-out;}
  @keyframes destello{from{background:var(--acento-suave);} to{background:transparent;}}

  /* Semana y tablero: columnas que se acomodan solas al ancho disponible.
     Con auto-fit el teléfono termina con una sola columna sin reglas aparte. */
  .semana,.tablero{display:grid;gap:10px;margin-top:4px;
                   grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
  .dia-semana,.col-medico{border:1px solid var(--rule);border-radius:5px;padding:8px 10px;
                          background:var(--surface);min-width:0;}
  .dia-semana.hoy{border-color:var(--acento);box-shadow:inset 0 0 0 1px var(--acento);}
  /* Un dia cerrado se distingue de un dia sin turnos: son cosas distintas. */
  .dia-semana.cerrado{background:var(--surface-2);}
  .dia-semana.cerrado h4.rotulo{color:var(--faint);}
  .dia-semana h4,.col-medico h4{margin:0 0 4px;font-size:13px;}
  /* El rotulo es TEXTO, no un boton: los botones no se imprimen, y por eso
     antes el papel salia con columnas sin nombre de dia ni de medico. */
  h4.rotulo{border-bottom:1px solid var(--rule);padding-bottom:4px;}
  h4.rotulo small{display:block;font-weight:400;font-size:11px;color:var(--muted);}
  h4.rotulo.clicable{cursor:pointer;}
  h4.rotulo.clicable:hover{color:var(--acento);}
  h4.rotulo.clicable:focus-visible{outline:2px solid var(--acento);outline-offset:2px;}
  .cuenta.alerta{color:var(--alerta) !important;font-weight:600;}
  .pie-semana{margin-top:10px;font-size:12px;color:var(--muted);}
  .lista-cuentas{list-style:none;margin:10px 0;padding:0;}
  .lista-cuentas li{display:flex;align-items:center;gap:10px;padding:4px 0;}
  .lista-cuentas .ayuda{margin:0;}
  .dia-semana .cuenta,.col-medico .cuenta{font-family:var(--mono);font-size:11.5px;
                                          color:var(--muted);margin-bottom:6px;}
  .dia-semana ul,.col-medico ul{list-style:none;margin:0;padding:0;}
  .dia-semana li,.col-medico li{font-size:12.5px;padding:3px 0;
                                border-bottom:1px solid var(--rule);
                                overflow-wrap:anywhere;}
  .dia-semana li:last-child,.col-medico li:last-child{border-bottom:0;}
  .col-medico li[data-turno]{cursor:pointer;}
  .col-medico li[data-turno]:hover{background:var(--acento-suave);}
  .col-medico li.libre{color:var(--faint);font-style:italic;}
  .col-medico li.sobre{background:var(--aviso-suave);}
  .dia-semana li .h,.col-medico li .h{font-family:var(--mono);color:var(--muted);}
  /* El tablero necesita más ancho que una agenda de un solo médico. Si el
     navegador no entiende :has(), queda en el ancho normal y se sigue viendo
     bien: es más angosto, no roto. */
  main:has(.tablero),main:has(.semana){max-width:1400px;}

  .estado{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;
          padding:2px 7px;border:1px solid currentColor;border-radius:3px;white-space:nowrap;}
  .e-RESERVADO{color:var(--acento);}
  .e-ATENDIDO{color:var(--ok);}
  .e-AUSENTE{color:var(--alerta);}
  .e-CANCELADO,.e-REPROGRAMADO{color:var(--faint);}
  .resumen{margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--muted);
           font-variant-numeric:tabular-nums;}

  /* ---------------- tablas ---------------- */
  .tabla-cont{overflow-x:auto;border:1px solid var(--rule);border-radius:6px;background:var(--surface);}
  table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:480px;}
  th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--rule);vertical-align:middle;}
  thead th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
           font-weight:600;background:var(--surface-2);white-space:nowrap;}
  tbody tr:last-child td{border-bottom:0;}
  tbody tr.inactiva{opacity:.5;}
  td.acciones{text-align:right;white-space:nowrap;}
  td.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px;}

  /* ---------------- avisos ---------------- */
  .caja{padding:12px 14px;border-left:3px solid var(--rule-fuerte);margin-bottom:14px;
        font-size:14px;border-radius:0 4px 4px 0;background:var(--surface);}
  .caja.error{border-color:var(--alerta);background:var(--alerta-suave);}
  .caja.aviso{border-color:var(--aviso);background:var(--aviso-suave);}
  .caja.ok{border-color:var(--acento);background:var(--acento-suave);}
  .caja h3{margin:0 0 4px;font-size:14px;font-weight:600;}
  .caja p{margin:0 0 6px;}
  .caja p:last-child{margin-bottom:0;}
  .caja ul{margin:6px 0 0;padding-left:20px;}
  .caja code{font-family:var(--mono);font-size:12.5px;}

  .vacio-msg{padding:26px;text-align:center;color:var(--muted);font-size:14px;}
  .cargando{padding:26px;text-align:center;color:var(--muted);font-size:14px;}

  /* ---------------- avisos flotantes ---------------- */
  #avisos-flotantes{position:fixed;right:16px;bottom:16px;z-index:60;
                    display:flex;flex-direction:column;gap:8px;max-width:380px;}
  .flotante{background:var(--surface);border:1px solid var(--rule-fuerte);border-left-width:3px;
            border-radius:5px;padding:10px 14px;box-shadow:var(--sombra);font-size:14px;}
  .flotante.ok{border-left-color:var(--acento);}
  .flotante.error{border-left-color:var(--alerta);}

  /* ---------------- diálogo ---------------- */
  .fondo-modal{position:fixed;inset:0;background:rgba(10,14,12,.55);z-index:50;
               display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;
               overflow-y:auto;}
  .modal{background:var(--surface);border-radius:8px;box-shadow:var(--sombra);
         width:100%;max-width:560px;margin:auto;}
  .modal header{position:static;border-radius:8px 8px 0 0;padding:14px 18px;
                border-bottom:1px solid var(--rule);}
  .modal .cuerpo{padding:18px;}
  .modal .pie{padding:14px 18px;border-top:1px solid var(--rule);
              display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
  .modal h2{margin:0;}

  /* Columnas de valores del registro de auditoría: son cadenas largas y sin
     esto una sola fila estira la tabla entera. */
  td.dato{font-size:12px;color:var(--ink);max-width:280px;overflow-wrap:anywhere;
          line-height:1.45;}
  td.dato > div{padding:1px 0;}
  .campo-aud{color:var(--muted);}
  .faint{color:var(--faint);}

  /* ---------------- cortina de inactividad ---------------- */
  .cortina{position:fixed;inset:0;z-index:80;background:var(--paper);
           display:flex;align-items:center;justify-content:center;padding:24px;}
  .caja-cortina{background:var(--surface);border:1px solid var(--rule-fuerte);
                border-radius:8px;padding:28px 32px;box-shadow:var(--sombra);
                max-width:440px;text-align:center;}
  .caja-cortina h2{margin:0 0 8px;}
  .caja-cortina p{color:var(--muted);}

  /* ---------------- impresion ----------------
     En el papel no van la barra, el menu ni los botones: va el contenido.
     Las tablas no se pueden cortar en dos hojas por la mitad de una fila. */
  @media print{
    header,.barra,.sello,.sin-imprimir,#avisos-flotantes,.fondo-modal,
    nav.menu,.btn,.cortina{display:none !important;}
    body{background:#fff;color:#000;font-size:11pt;}
    main{max-width:none;padding:0;}
    section.bloque{border:0;padding:0;margin:0 0 12pt;break-inside:avoid;}
    .caja{border:1px solid #999;padding:8pt;}
    table{width:100%;border-collapse:collapse;}
    th,td{border:1px solid #bbb;padding:3pt 5pt;font-size:9.5pt;}
    thead{display:table-header-group;}          /* el encabezado se repite */
    tr,.franja,.dia-semana,.col-medico{break-inside:avoid;}
    .grilla{border:1px solid #999;}
    .franja{border-bottom:1px solid #ddd;}
    .semana,.tablero{display:block;}
    .dia-semana,.col-medico{border:1px solid #999;margin-bottom:8pt;}
    /* Que en el papel se sepa de que dia y de que medico es cada bloque. */
    h4.rotulo{font-size:11pt;border-bottom:1px solid #999;padding-bottom:2pt;color:#000;}
    h4.rotulo small{color:#333;}
    .pie-semana{color:#000;font-size:9pt;}
    a[href]::after{content:"";}                  /* sin URLs pegadas al texto */
    .pie-impresion{display:block !important;margin-top:10pt;padding-top:6pt;
                   border-top:1px solid #999;font-size:8.5pt;color:#444;}
  }
  .pie-impresion{display:none;}

  .oculto{display:none !important;}
  .pill{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:3px;
        border:1px solid currentColor;text-transform:uppercase;letter-spacing:.04em;}
  .pill.si{color:var(--ok);} .pill.no{color:var(--faint);}
  .pill.prop{color:var(--aviso);}

  @media (max-width:620px){
    /* En el teléfono la barra se apila: cada control ocupa el ancho completo
       en lugar de quedar apretado contra los otros. */
    .barra{gap:8px;}
    .barra > select,.barra > input[type=date]{flex:1 1 100%;}
    .barra .nav-fechas{flex:1 1 auto;}
    .barra .nav-fechas .btn{flex:1;}
    .sello{margin-left:0;flex:1 1 100%;}
    .semana,.tablero{grid-template-columns:1fr;}
    .franja{grid-template-columns:54px 1fr;grid-template-areas:"h quien" ". est";row-gap:4px;}
    .franja .h{grid-area:h;} .franja .quien{grid-area:quien;}
    .franja .estado{grid-area:est;justify-self:start;}
    main{padding:12px;}
    nav.menu{order:3;width:100%;margin-left:0;}
    .yo{order:2;margin-left:auto;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
</style>

<!-- El transporte lo elige quien arma la pantalla. Acá, servida por PORTAL,
     va el viejo; construir-pagina.js pone transporte_web en su lugar. -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// =====================================================================
//  Transporte NUEVO: la pantalla es un archivo estático en GitHub Pages y
//  le habla a NÚCLEO directamente.
//
//  ================================================================
//   POR QUÉ text/plain, QUE PARECE UN ERROR Y NO LO ES
//
//   Cuando una página le habla a un servidor de otro dominio, el navegador
//   manda ANTES un pedido de permiso (OPTIONS) y espera que el servidor lo
//   conteste. Apps Script no contesta ese pedido: no hay forma de hacerlo.
//
//   La salida es no provocarlo. El navegador se saltea ese permiso previo
//   cuando el pedido es "simple": sin encabezados propios y con un tipo de
//   contenido de una lista corta, en la que está text/plain y NO está
//   application/json.
//
//   Así que el cuerpo es JSON pero viaja rotulado como texto. Del otro lado,
//   doPost lee e.postData.contents y lo interpreta igual. NO CAMBIAR ESTE
//   ENCABEZADO por el "correcto": el pedido dejaría de salir, y el error que
//   se ve en pantalla no menciona ni una vez la palabra CORS.
//
//   Por lo mismo, la credencial va en el CUERPO y no en un encabezado
//   Authorization: cualquier encabezado propio vuelve a disparar el permiso
//   previo.
//  ================================================================
//
//  ================================================================
//   QUÉ PROTEGE ESTA PUERTA, Y QUÉ NO
//
//   La dirección de NÚCLEO está a la vista en este archivo. No es un
//   descuido: no hay forma de esconderla, y esconderla no protegería nada.
//   Lo que protege es la credencial:
//
//   · Para ENTRAR hace falta un token de Google emitido PARA ESTA
//     APLICACIÓN. Google solo se lo da a una página servida desde el origen
//     autorizado en la consola —https://mediahubstudio.github.io— así que un
//     token válido no se puede conseguir desde otro lado.
//   · Ese token se cambia por un ticket firmado por NÚCLEO. Sin ticket
//     válido, NÚCLEO no contesta nada.
//   · Y tener ticket no autoriza: los permisos se resuelven contra la hoja
//     USUARIOS en cada pedido. Dar de baja a alguien tiene efecto inmediato.
//
//   El ticket se guarda en sessionStorage y no en localStorage: es una
//   credencial, y muere al cerrar la pestaña. En un mostrador compartido esa
//   diferencia importa.
//  ================================================================
//
//  CLIENT_ID y URL_NUCLEO los escribe construir-pagina.js al armar el
//  archivo. Ver ese script.
// =====================================================================

var TRANSPORTE = 'web';
var CLAVE_TICKET = 'cic-agenda:ticket:v1';

function ticketGuardado() {
  try { return sessionStorage.getItem(CLAVE_TICKET) || null; } catch (e) { return null; }
}
function guardarTicket(t) {
  try { sessionStorage.setItem(CLAVE_TICKET, t); } catch (e) {}
  // Recién acá se suelta el token de Google: ya no hace falta. Mientras no
  // haya ticket sigue guardado, porque si el primer pedido se pierde en el
  // camino el reintento necesita volver a presentarlo. Soltarlo antes dejaba
  // a la persona sin credencial y con un error, por un corte de un segundo.
  TOKEN_PENDIENTE = null;
}
function olvidarTicket() {
  try { sessionStorage.removeItem(CLAVE_TICKET); } catch (e) {}
}

// El token de Google se usa UNA vez, para canjearlo por un ticket. Queda acá
// entre que Google lo entrega y sale el primer pedido, y no se guarda en
// ningún lado más.
var TOKEN_PENDIENTE = null;

function enviarPedido(accion, datos) {
  var cuerpo = { accion: accion, datos: datos };

  var t = ticketGuardado();
  if (t) {
    cuerpo.ticket = t;
  } else if (TOKEN_PENDIENTE) {
    cuerpo.token = TOKEN_PENDIENTE;
  } else {
    return Promise.reject({ codigo: 'SIN_CREDENCIAL',
      mensaje: 'Hay que identificarse con Google para entrar.' });
  }

  var t0 = Date.now();
  return fetch(URL_NUCLEO, {
    method: 'POST',
    // Ver la nota larga de arriba antes de tocar esta línea.
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(cuerpo),
    redirect: 'follow'
  }).then(function (resp) {
    if (!resp.ok) {
      throw { codigo: 'NUCLEO_ERROR',
              mensaje: 'El servidor respondió ' + resp.status + '.' };
    }
    return resp.text();
  }).then(function (texto) {
    var r;
    try { r = JSON.parse(texto); }
    catch (e) {
      // Apps Script devuelve HTML cuando la implementación pide iniciar
      // sesión. Decirlo así ahorra media hora de buscar en el lugar
      // equivocado.
      throw { codigo: 'NUCLEO_ERROR',
              mensaje: texto.indexOf('<') === 0
                ? 'El servidor pidió iniciar sesión. La implementación de NÚCLEO ' +
                  'tiene que estar en "Cualquier persona".'
                : 'El servidor devolvió una respuesta inesperada.' };
    }
    // Ya no hay salto entre proyectos: ese tramo vale cero, y que se vea en
    // la pantalla de Velocidad es justamente la comprobación del cambio.
    r.ms_fetch = 0;
    return r;
  }).catch(function (e) {
    if (e && e.codigo) throw e;
    throw { codigo: 'FALLO_RED',
            mensaje: 'No se pudo llegar al servidor. Revisá la conexión.' };
  });
}

// ---------------------------------------------------------------- identidad

var identidadLista = null;

/**
 * Consigue una credencial antes de que arranque el resto de la pantalla.
 *
 * Si ya hay ticket en esta pestaña, no molesta a nadie. Si no, le pide a
 * Google que identifique a la persona: cuando ya hay una sesión de Google
 * abierta, eso es un parpadeo y no aparece ningún cartel.
 */
function arrancarIdentidad() {
  if (ticketGuardado()) return Promise.resolve();
  if (identidadLista) return identidadLista;

  identidadLista = esperarAGoogle().then(function () {
    return new Promise(function (res) {
      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: function (r) {
          TOKEN_PENDIENTE = r.credential;
          ocultarPantallaDeIngreso();
          res();
        },
        auto_select: true,          // si ya entró antes, entra solo
        cancel_on_tap_outside: false,
        itp_support: true
      });

      // Se dibuja el botón SIEMPRE, no solo si falla el intento automático:
      // el aviso emergente de Google lo bloquean muchos navegadores y
      // extensiones, y quedarse esperando algo que nunca aparece es la peor
      // pantalla posible. Si el ingreso automático funciona, esto se ve un
      // instante y desaparece.
      pantallaDeIngreso();
      google.accounts.id.prompt();
    });
  });
  return identidadLista;
}

/** El archivo de Google se carga con `async`: puede no estar todavía. */
function esperarAGoogle() {
  return new Promise(function (res, rej) {
    var desde = Date.now();
    (function mirar() {
      if (window.google && google.accounts && google.accounts.id) return res();
      if (Date.now() - desde > 12000) {
        return rej({ codigo: 'SIN_GOOGLE',
          mensaje: 'No se pudo cargar el ingreso de Google. Revisá la conexión ' +
                   'o si alguna extensión del navegador lo está bloqueando.' });
      }
      setTimeout(mirar, 120);
    })();
  });
}

function pantallaDeIngreso() {
  if ($('ingreso')) return;
  var capa = document.createElement('div');
  capa.id = 'ingreso';
  capa.className = 'cortina';
  capa.innerHTML =
    '<div class="caja-cortina">' +
      '<h2>Agenda de Turnos · CIC 2</h2>' +
      '<p>Entrá con la cuenta de Google que tenés dada de alta en el sistema.</p>' +
      '<div id="boton-google" style="display:flex;justify-content:center;margin:14px 0"></div>' +
      '<p class="ayuda">Si en esta computadora hay varias cuentas abiertas, acá ' +
      'elegís con cuál entrar. No hace falta cerrar ninguna sesión.</p>' +
    '</div>';
  document.body.appendChild(capa);
  google.accounts.id.renderButton($('boton-google'), {
    theme: 'outline', size: 'large', text: 'signin_with',
    shape: 'pill', locale: 'es', width: 280
  });
}

function ocultarPantallaDeIngreso() {
  var c = $('ingreso');
  if (c && c.parentNode) c.parentNode.removeChild(c);
}

/**
 * La credencial dejó de valer: se olvida y se vuelve a pedir.
 *
 * Pasa cuando vence el ticket —doce horas— o cuando alguien lo alteró. Se
 * recarga la página entera a propósito: reconstruir el estado a mano después
 * de un cambio de identidad es la clase de arreglo del que se escapan casos.
 */
function renovarIdentidad() {
  olvidarTicket();
  identidadLista = null;
  location.reload();
}

/**
 * Salir de verdad.
 *
 * Acá sí se puede, y es la diferencia grande con la puerta vieja: se borra el
 * ticket y se le dice a Google que no vuelva a entrar solo. La sesión de
 * Google del navegador NO se toca —Gmail y Drive siguen abiertos—, que es
 * justo lo que hacía falta en el mostrador.
 */
function cerrarIdentidad() {
  olvidarTicket();
  try { google.accounts.id.disableAutoSelect(); } catch (e) {}
}
</script>

<script>
// =====================================================================
//  Utilidades compartidas por todas las pantallas.
// =====================================================================

var S = {
  sesion: null,      // respuesta de sesion.iniciar
  vista: null,       // 'agenda' | 'config'
  verComo: null,     // rol elegido en la cabecera (solo comodidad visual)
  timer: null,
  // Tiempos del ultimo pedido, desglosados. Se muestran en la cabecera:
  // sin verlos, cualquier intento de acelerar el sistema es a ciegas.
  tiempos: null,
  // Cuanto estuvo el ultimo pedido haciendo cola antes de salir. Se mide
  // aparte porque NO es tiempo de servidor: confundirlo lleva a buscar el
  // problema donde no esta.
  espera: 0
};

function $(id) { return document.getElementById(id); }
function $$(sel, raiz) { return Array.prototype.slice.call((raiz || document).querySelectorAll(sel)); }

/** Escapa texto para insertarlo en HTML. Todo lo que venga del servidor
 *  pasa por acá: nombres de pacientes, motivos, observaciones. */
function txt(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

// ---------------------------------------------------------------- fechas

function hoyLocal() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
function sumarDias(f, n) {
  var p = f.split('-');
  var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
var DIAS  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio',
             'agosto','septiembre','octubre','noviembre','diciembre'];
var DIAS_SEMANA = [null,'Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

function fechaLarga(f) {
  var p = f.split('-');
  var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
  return DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()];
}
function fechaCorta(f) {
  var p = String(f).split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
}

// ---------------------------------------------------------------- servidor

/** Clave de una operacion, para que un reintento no cree un duplicado. */
function nuevaIdem() {
  return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

// Fallos que valen la pena reintentar: son de transporte, no de negocio.
var CODIGOS_TRANSITORIOS = ['NUCLEO_ERROR', 'FALLO_RED', 'SIN_CONEXION',
                            'SIN_RESPUESTA', 'SISTEMA_OCUPADO', 'PEDIDO_VENCIDO'];

// Cuánto se espera una respuesta antes de darla por perdida.
//
// ESTO NO ES UN DETALLE. google.script.run a veces no llama a NINGUNO de sus
// dos manejadores —ni éxito ni fallo—, y entonces la promesa nunca termina.
// Sin este reloj, esa llamada quedaba para siempre contada como "activa" en
// la cola, la cola no arrancaba ninguna más, y el sistema entero se quedaba
// en "Cargando…" hasta recargar la página. Era la traba.
//
// Reintentar es seguro incluso si el pedido original sí llegó: las escrituras
// viajan con clave `idem` y el servidor reconoce el repetido.
var ESPERA_MAXIMA_MS = 25000;

/**
 * Una llamada al servidor, con reloj.
 *
 * ================================================================
 *  ESTE ARCHIVO NO SABE CÓMO VIAJA UN PEDIDO
 *
 *  El envío lo hace enviarPedido(), que define el archivo de transporte:
 *
 *    transporte_portal.html  google.script.run, la pantalla servida por PORTAL
 *    transporte_web.html     fetch directo a NÚCLEO, la pantalla estática
 *
 *  Toda la lógica de la aplicación —vistas, cola, reintentos, caché— es la
 *  misma en las dos. Así el camino nuevo se pudo montar sin tocar nada de lo
 *  que ya andaba, y el viejo sigue siendo una salida de emergencia de verdad
 *  y no un pedazo de código muerto que nadie probó nunca.
 * ================================================================
 *
 * enviarPedido devuelve una promesa con el SOBRE completo de la respuesta
 * ({ ok, datos, ms, ... }), no con los datos: acá se decide qué es error.
 * Solo rechaza cuando el pedido no llegó a destino.
 */
function unaLlamada(accion, datos, esperaCola) {
  var t0 = Date.now();
  S.espera = esperaCola || 0;
  return new Promise(function (res, rej) {
    var listo = false;
    var reloj = setTimeout(function () {
      if (listo) return;
      listo = true;
      registrarTiempos(accion, t0, null);
      rej({ codigo: 'SIN_RESPUESTA',
            mensaje: 'El servidor no contestó a tiempo. Probando de nuevo…' });
    }, ESPERA_MAXIMA_MS);

    function terminar(fn) {
      return function (x) {
        if (listo) return;              // llegó después del reloj: se ignora
        listo = true;
        clearTimeout(reloj);
        fn(x);
      };
    }

    var envio;
    try { envio = enviarPedido(accion, datos || {}); }
    catch (e) { envio = Promise.reject(e); }

    envio.then(
      terminar(function (r) {
        registrarTiempos(accion, t0, r);
        // El servidor puede mandar una credencial renovada en cualquier
        // respuesta. Se guarda antes de mirar si la operación salió bien:
        // vale igual, y perderla obligaría a volver a identificarse.
        if (r && r.ticket && typeof guardarTicket === 'function') guardarTicket(r.ticket);
        if (r && r.ok) return res(r.datos);
        // La credencial se venció en medio del uso. No es un error de nadie:
        // pasaron las horas. Se renueva sin cartel y sin preguntar. Es lo
        // único que atraviesa la cola y los reintentos, porque reintentar con
        // una credencial vencida solo repite el mismo rechazo.
        if (r && (r.codigo === 'CREDENCIAL_VENCIDA' || r.codigo === 'CREDENCIAL_INVALIDA') &&
            typeof renovarIdentidad === 'function') {
          renovarIdentidad();
          return;                      // la página se está recargando
        }
        rej(r || { codigo:'SIN_RESPUESTA', mensaje:'El servidor no respondió.' });
      }),
      terminar(function (e) {
        registrarTiempos(accion, t0, null);
        rej((e && e.codigo) ? e
          : { codigo:'FALLO_RED', mensaje: (e && e.message) ? e.message : String(e) });
      })
    );
  });
}

/**
 * Desglosa cuanto tardo el pedido y en que tramo.
 *
 *   total    lo que espera la persona, medido en el navegador
 *   nucleo   trabajo real: leer las planillas, validar, escribir
 *   salto    abrir la conexion contra NUCLEO desde PORTAL y arrancarla.
 *            Con la pantalla estatica es CERO: ese salto ya no existe.
 *   viaje    todo lo demas: arrancar la ejecucion y volver al navegador
 *
 * Si "salto" y "viaje" se llevan la mayor parte, el problema no es lo que el
 * sistema hace sino cuantas veces cruza de una punta a la otra, y optimizar
 * consultas no sirve de nada. Eso es lo que dijeron las mediciones, y es la
 * razon de que la pantalla se haya mudado fuera de Apps Script.
 */
function registrarTiempos(accion, t0, r) {
  var total = Date.now() - t0;
  var nucleo = (r && r.ms) || 0;
  var salto = Math.max(0, ((r && r.ms_fetch) || 0) - nucleo);
  var viaje = Math.max(0, total - nucleo - salto);
  S.tiempos = { accion: accion, total: total, nucleo: nucleo, salto: salto, viaje: viaje,
                espera: S.espera || 0, perfil: (r && r.perfil) || null };
  if (typeof mostrarTiempos === 'function') mostrarTiempos();
  // Al registro del navegador, para poder pegarlo tal cual cuando algo tarda.
  if (r && r.perfil && r.perfil.length) {
    console.log('[tiempos] ' + accion + ' ' + total + ' ms · ' +
      r.perfil.map(function (p) { return p.paso + ' ' + p.ms + 'ms' +
        (p.n > 1 ? ' x' + p.n : ''); }).join(' · '));
  }
}

// ---------------------------------------------------------------- la cola
//
// Apps Script no lleva bien que el navegador le dispare varios pedidos a la
// vez: aparecen fallos HTTP 401 que no tienen nada que ver con permisos.
// Navegar rapido por las pestañas hacia justamente eso -- se disparaban el
// pedido de la pestaña anterior, el de la nueva y los de precarga, todos
// encimados.
//
// Dos carriles. El de primer plano es lo que la persona esta esperando; el
// de fondo son las precargas, que solo arrancan cuando no hay nada mas.
// Asi una precarga nunca le hace esperar a nadie ni compite por el turno.
var COLA = { activas: 0, tope: 2, espera: [], fondo: [] };

function encolar(fn, esFondo) {
  return new Promise(function (res, rej) {
    (esFondo ? COLA.fondo : COLA.espera)
      .push({ fn: fn, res: res, rej: rej, encolado: Date.now() });
    bombearCola();
  });
}

function bombearCola() {
  while (COLA.activas < COLA.tope && COLA.espera.length) arrancarDeCola(COLA.espera.shift());
  // El fondo espera a que el primer plano este vacio del todo.
  if (COLA.activas === 0 && !COLA.espera.length && COLA.fondo.length) {
    arrancarDeCola(COLA.fondo.shift());
  }
}

function arrancarDeCola(t) {
  COLA.activas++;
  // Un cinturón más: si la función encolada reventara antes de devolver una
  // promesa, el contador quedaría trabado y la cola no volvería a arrancar.
  var p;
  try { p = t.fn(Date.now() - t.encolado); }
  catch (e) { p = Promise.reject(e); }

  p.then(
    function (v) { COLA.activas--; t.res(v); bombearCola(); },
    function (e) { COLA.activas--; t.rej(e); bombearCola(); }
  );
}

/**
 * Unica via de comunicacion con el servidor.
 * Resuelve con los datos, o rechaza con { codigo, mensaje, datos }.
 *
 * Reintenta hasta dos veces ante fallos de transporte, esperando cada vez un
 * poco mas. Reintentar una escritura seria peligroso si no fuera porque los
 * datos llevan una clave `idem`: el servidor reconoce el reintento y devuelve
 * el resultado de la primera vez en lugar de guardar de nuevo. Sin esa clave,
 * un corte a destiempo dejaba el registro duplicado.
 *
 * @param opciones { fondo: true } para precargas, que ceden el paso.
 */
function llamar(accion, datos, opciones) {
  datos = datos || {};
  return encolar(function (esperaCola) { return conReintentos(accion, datos, 0, esperaCola); },
                 opciones && opciones.fondo);
}

var ESPERAS_REINTENTO = [700, 1800];

function conReintentos(accion, datos, intento, esperaCola) {
  return unaLlamada(accion, datos, esperaCola).catch(function (err) {
    if (CODIGOS_TRANSITORIOS.indexOf(err && err.codigo) < 0) throw err;
    if (intento >= ESPERAS_REINTENTO.length) throw err;
    return new Promise(function (res) { setTimeout(res, ESPERAS_REINTENTO[intento]); })
      .then(function () { return conReintentos(accion, datos, intento + 1, esperaCola); });
  });
}

// ------------------------------------------------- lo que se recuerda entre visitas
//
// El arranque esperaba a que el servidor contestara para dibujar cualquier
// cosa. Como en Apps Script esa respuesta tarda segundos, la persona miraba
// una pantalla vacía cada vez que entraba.
//
// Se guarda en el navegador lo que NO cambia de un día para el otro —quién
// sos, qué podés hacer, los médicos y consultorios— y con eso la pantalla se
// dibuja entera de entrada. Los datos reales llegan detrás y la reemplazan.
//
// LO QUE NO SE GUARDA, a propósito: la agenda. Ahí van nombres y teléfonos
// de pacientes, y eso no queda en el navegador de nadie.
//
// Los permisos guardados solo deciden qué botones se dibujan. El servidor
// revalida cada acción igual, así que una foto vieja no puede habilitar
// nada: como mucho muestra un botón que después da error.

var CLAVE_MEMORIA = 'cic-agenda:sesion:v1';
var VIDA_MEMORIA_MS = 12 * 3600 * 1000;

function recordarSesion(s) {
  try {
    localStorage.setItem(CLAVE_MEMORIA, JSON.stringify({
      guardado: Date.now(),
      usuario: s.usuario, vistas: s.vistas, permisos: s.permisos,
      catalogos: s.catalogos, config: s.config, hoy: s.hoy
    }));
  } catch (e) { /* modo privado, o sin espacio: se sigue sin memoria */ }
}

function sesionRecordada() {
  try {
    var v = localStorage.getItem(CLAVE_MEMORIA);
    if (!v) return null;
    var s = JSON.parse(v);
    if (!s || !s.usuario || !s.permisos) return null;
    if (Date.now() - s.guardado > VIDA_MEMORIA_MS) return null;
    return s;
  } catch (e) { return null; }
}

function olvidarSesion() {
  try { localStorage.removeItem(CLAVE_MEMORIA); } catch (e) {}
}

// ------------------------------------------------------------ caché local
//
// Cambiar de pestaña en Configuración volvía a pedir al servidor la misma
// lista que se acababa de mostrar. Con cada pedido costando segundos, eso
// se siente como si el sistema se colgara en cada clic.
//
// Estas listas cambian solo cuando alguien las edita desde acá mismo, así
// que se guardan en memoria de la pestaña y se descartan enteras después de
// cada guardado (olvidarCache). No se guarda nada de turnos ni de
// pacientes: eso cambia por lo que hacen otros y tiene que llegar fresco.
var CACHE_CLIENTE = {};

// Media hora. Estas listas solo cambian cuando alguien las edita desde acá
// mismo, y cada guardado reemplaza en el acto lo guardado. Con dos minutos,
// volver a Configuración un rato después costaba de nuevo el pedido entero:
// era la razón por la que las solapas seguían tardando.
var VIDA_CACHE_SEG = 1800;

function llamarCacheado(accion, datos, segundos, opciones) {
  var clave = accion + ':' + JSON.stringify(datos || {});
  var e = CACHE_CLIENTE[clave];
  if (e && (Date.now() - e.t) < (segundos || VIDA_CACHE_SEG) * 1000) {
    // Se devuelve una copia: si la pantalla modificara el objeto, la
    // siguiente lectura de la caché vería datos alterados.
    return Promise.resolve(JSON.parse(e.json));
  }
  return llamar(accion, datos, opciones).then(function (r) {
    try { CACHE_CLIENTE[clave] = { t: Date.now(), json: JSON.stringify(r) }; } catch (x) {}
    return r;
  });
}

/**
 * Guarda una respuesta que ya llegó por otro camino —típicamente adentro de
 * la respuesta de un guardado— para que la próxima pantalla la encuentre
 * sin pedirla.
 */
function guardarEnCache(accion, datos, resultado) {
  var clave = accion + ':' + JSON.stringify(datos || {});
  try { CACHE_CLIENTE[clave] = { t: Date.now(), json: JSON.stringify(resultado) }; } catch (x) {}
}

/** Lo que haya guardado para ese pedido, o null. */
function leerCache(accion, datos) {
  var e = CACHE_CLIENTE[accion + ':' + JSON.stringify(datos || {})];
  if (!e) return null;
  try { return JSON.parse(e.json); } catch (x) { return null; }
}

/** Descarta lo guardado. Sin prefijo, todo. */
function olvidarCache(prefijo) {
  Object.keys(CACHE_CLIENTE).forEach(function (k) {
    if (!prefijo || k.indexOf(prefijo) === 0) delete CACHE_CLIENTE[k];
  });
}

/** ¿El rol del usuario otorga este permiso? Solo decide qué botones se
 *  dibujan; el servidor revalida todo igual. */
function puede(permiso) {
  var p = S.sesion && S.sesion.permisos ? S.sesion.permisos[permiso] : null;
  if (p === true) return true;
  if (Array.isArray(p)) return p.length > 0;
  return false;
}
function alcance(permisoBase) {
  var p = S.sesion && S.sesion.permisos ? S.sesion.permisos[permisoBase] : null;
  return Array.isArray(p) ? p : [];
}

// --------------------------------------------------------- guardar sin esperar

/**
 * Cuántas operaciones están viajando al servidor en este momento. La
 * cabecera lo muestra: guardar deja de bloquear la pantalla, pero nunca deja
 * de verse que hay algo en vuelo.
 */
var enVuelo = 0;

function marcarEnVuelo(delta) {
  enVuelo = Math.max(0, enVuelo + delta);
  var el = $('pendientes');
  if (!el) return;
  el.textContent = enVuelo ? 'guardando…' : '';
  el.style.color = 'var(--aviso)';
}

/**
 * Guarda sin hacer esperar a la persona.
 *
 * El cambio se aplica en pantalla de inmediato y el pedido viaja por detrás.
 * Con Apps Script cada pedido cuesta segundos, y esperarlos con el diálogo
 * abierto y el botón gris es lo que hace sentir el sistema trabado.
 *
 * Regla que no se negocia: el servidor sigue siendo el que manda. Si rechaza
 * el cambio —una franja que otro acaba de ocupar, una versión vieja— se
 * deshace lo que se había pintado y el error se muestra fuerte. Nunca puede
 * quedar en pantalla algo que no se guardó.
 *
 * cfg = {
 *   accion, datos,        qué mandar
 *   aplicar,              (opcional) función que cambia la lista en memoria
 *                         y devuelve otra función para volver atrás
 *   ok,                   aviso al confirmar
 *   alConfirmar,          (opcional) qué hacer con la respuesta real
 *   alFallar              (opcional) además de deshacer; si devuelve true,
 *                         se entiende que ya mostró el problema y no se
 *                         agrega el aviso genérico
 * }
 */
function guardarSinEsperar(cfg) {
  var deshacer = cfg.aplicar ? cfg.aplicar() : null;
  marcarEnVuelo(1);

  llamar(cfg.accion, cfg.datos)
    .then(function (r) {
      marcarEnVuelo(-1);
      if (cfg.alConfirmar) cfg.alConfirmar(r);
      if (cfg.ok) avisar(cfg.ok);
    })
    .catch(function (err) {
      marcarEnVuelo(-1);
      if (deshacer) deshacer();
      var manejado = cfg.alFallar ? cfg.alFallar(err) === true : false;
      if (manejado) return;
      // Se avisa fuerte y se deja el detalle a la vista: un guardado que no
      // entró tiene que doler, no pasar desapercibido.
      avisar('NO se guardó: ' + (err.mensaje || 'error desconocido'), 'error');
      if ($('cfg-avisos')) mostrarError(err, $('cfg-avisos'));
    });
}

// ---------------------------------------------------------------- avisos

function avisar(mensaje, tipo) {
  var caja = document.createElement('div');
  caja.className = 'flotante ' + (tipo || 'ok');
  caja.textContent = mensaje;
  $('avisos-flotantes').appendChild(caja);
  setTimeout(function () {
    if (caja.parentNode) caja.parentNode.removeChild(caja);
  }, tipo === 'error' ? 8000 : 4000);
}

/**
 * Muestra un error del servidor. Los mensajes vienen escritos para leerse
 * tal cual, asi que no se reescriben; solo se agregan los datos extra
 * cuando el error trae una salida posible.
 */
function mostrarError(err, contenedor, alReintentar) {
  var extra = '';
  if (err && err.datos) {
    if (err.datos.alternativas && err.datos.alternativas.length) {
      extra = '<p>Horarios libres más cercanos: <b>' +
        err.datos.alternativas.map(function (a) { return txt(a.hora); }).join(' · ') + '</b></p>';
    } else if (err.datos.turnos && err.datos.turnos.length) {
      extra = '<ul>' + err.datos.turnos.slice(0, 8).map(function (t) {
        return '<li>' + txt(fechaCorta(t.fecha) + ' ' + t.hora + ' · turno ' + t.nro_turno) + '</li>';
      }).join('') + '</ul>';
    } else if (err.datos.usos && err.datos.usos.length) {
      extra = '<ul>' + err.datos.usos.map(function (u) { return '<li>' + txt(u) + '</li>'; }).join('') + '</ul>';
    }
  }
  var html = '<div class="caja error"><h3>' + txt(err.mensaje || 'Ocurrió un error') + '</h3>' +
             extra + (err.codigo ? '<p><code>' + txt(err.codigo) + '</code></p>' : '') +
             (alReintentar ? '<p><button class="btn chico" id="btn-reintentar">Reintentar</button></p>' : '') +
             '</div>';
  if (contenedor) {
    // Se reemplaza el contenido: si quedaba un "Cargando..." tiene que
    // desaparecer. Una pantalla trabada en Cargando no dice nada y no deja
    // salir.
    contenedor.innerHTML = html;
    if (alReintentar && $('btn-reintentar')) {
      $('btn-reintentar').addEventListener('click', alReintentar);
    }
    contenedor.scrollIntoView({ block: 'nearest' });
  } else {
    avisar(err.mensaje || 'Ocurrió un error', 'error');
  }
}

// ---------------------------------------------------------------- diálogo

/**
 * @param opciones { titulo, cuerpo (html), textoAceptar, alAceptar (fn -> Promise|bool), ancho }
 * alAceptar devuelve false o lanza para dejar el diálogo abierto.
 */
function abrirModal(opciones) {
  cerrarModal();
  var fondo = document.createElement('div');
  fondo.className = 'fondo-modal';
  fondo.innerHTML =
    '<div class="modal" role="dialog" aria-modal="true" style="max-width:' +
      (opciones.ancho || 560) + 'px">' +
      '<header><h2>' + txt(opciones.titulo) + '</h2></header>' +
      '<div class="cuerpo">' +
        '<div id="modal-error"></div>' +
        opciones.cuerpo +
      '</div>' +
      '<div class="pie">' +
        '<button class="btn" id="modal-cancelar">Cancelar</button>' +
        (opciones.textoAceptar
          ? '<button class="btn principal" id="modal-aceptar">' + txt(opciones.textoAceptar) + '</button>'
          : '') +
      '</div>' +
    '</div>';
  document.body.appendChild(fondo);

  $('modal-cancelar').addEventListener('click', cerrarModal);
  fondo.addEventListener('mousedown', function (e) { if (e.target === fondo) cerrarModal(); });
  document.addEventListener('keydown', escaparModal);

  if (opciones.alAceptar) {
    $('modal-aceptar').addEventListener('click', function () {
      var boton = this;
      boton.disabled = true;
      Promise.resolve()
        .then(function () { return opciones.alAceptar(); })
        .then(function (r) { if (r !== false) cerrarModal(); else boton.disabled = false; })
        .catch(function (err) { mostrarError(err, $('modal-error')); boton.disabled = false; });
    });
  }
  var primero = fondo.querySelector('input,select,textarea');
  if (primero) primero.focus();
  return fondo;
}

function escaparModal(e) { if (e.key === 'Escape') cerrarModal(); }

function cerrarModal() {
  var f = document.querySelector('.fondo-modal');
  if (f) f.parentNode.removeChild(f);
  document.removeEventListener('keydown', escaparModal);
}

function valorModal(id) {
  var el = $(id);
  if (!el) return '';
  if (el.type === 'checkbox') return el.checked;
  return el.value.trim();
}

// ---------------------------------------------------------------- catálogos

function nombreDe(lista, id) {
  if (!lista) return '';
  for (var i = 0; i < lista.length; i++) if (lista[i].id === id) return lista[i].nombre;
  return '';
}
function medicoDe(id) {
  var ms = S.sesion.catalogos.medicos;
  for (var i = 0; i < ms.length; i++) if (ms[i].id === id) return ms[i];
  return null;
}
function nombreMedico(id) {
  var m = medicoDe(id);
  return m ? (m.apellido + ', ' + m.nombre) : '';
}

/** Opciones de un <select> a partir de un catálogo. */
function opciones(lista, seleccionado, etiqueta, vacio) {
  var html = vacio ? '<option value="">' + txt(vacio) + '</option>' : '';
  return html + (lista || []).map(function (x) {
    var t = etiqueta ? etiqueta(x) : x.nombre;
    return '<option value="' + txt(x.id) + '"' +
           (x.id === seleccionado ? ' selected' : '') + '>' + txt(t) + '</option>';
  }).join('');
}

/** Recarga los catálogos en memoria tras un cambio de configuración, para
 *  que los desplegables de toda la aplicación queden al día sin recargar. */
function refrescarCatalogos() {
  return llamar('config.catalogos', {}).then(function (r) {
    S.sesion.catalogos = r.catalogos;
  }).catch(function (err) {
    // Que no se puedan refrescar los catalogos no invalida lo que se acaba
    // de guardar: se avisa y se sigue con los que ya estaban en memoria.
    avisar('No pude refrescar las listas: ' + (err.mensaje || ''), 'error');
  });
}
</script>

<script>
// =====================================================================
//  Vista: agenda del dia.
// =====================================================================

// grillas: agendas ya traidas, por medico y fecha. sellos: cuando llego cada
// una. Moverse de dia no vuelve a preguntar: la respuesta ya esta aca.
var A = { medicoId: null, fecha: null, huella: null, grillas: {}, sellos: {},
          // 'dia' | 'semana' | 'tablero'. Recepción arranca en tablero: lo que
          // mira al llegar es el día entero del centro, no un médico.
          modo: null,
          // Mientras la pantalla se dibujó de memoria, la agenda todavía no
          // llegó: la trae sesion.iniciar y no hay que pedirla aparte.
          esperandoSesion: false };

/** Con qué vista abre cada rol. Es solo el punto de partida: cualquiera
 *  puede cambiar de modo con los botones. */
function modoInicial() {
  if (A.modo) return A.modo;
  if (alcance('agenda.ver').indexOf('TODOS') < 0) return 'dia';   // el médico, su día
  return (S.verComo === 'RECEPCION') ? 'tablero' : 'dia';
}

var FRESCA_MS = 20000;   // debajo de esto no se vuelve a pedir

function claveAgenda(medicoId, fecha) { return medicoId + '|' + fecha; }

/** Se llama cuando cambia la configuracion de horarios: lo guardado dejo de
 *  valer y hay que volver a pedirlo. */
function olvidarAgendas() {
  A.grillas = {}; A.sellos = {}; A.huella = null; RANGOS_PEDIDOS = {};
}

// Rangos ya pedidos, para no pedir dos veces lo mismo cuando la persona se
// mueve rapido por el calendario.
var RANGOS_PEDIDOS = {};

// Lo que tiene que estar en el navegador alrededor del dia que se mira: el
// dia anterior y la semana siguiente. Mientras eso este cubierto, moverse no
// pide nada.
var DIAS_ATRAS = 1, DIAS_ADELANTE = 6;
// Lo que se trae cuando falta algo: mas ancho que lo que hace falta, porque
// el costo esta en el viaje y no en los dias.
var VENTANA_ATRAS = 3, VENTANA_DIAS = 14;

function ventanaCubierta(medicoId, fecha) {
  for (var i = -DIAS_ATRAS; i <= DIAS_ADELANTE; i++) {
    if (!A.grillas[claveAgenda(medicoId, sumarDias(fecha, i))]) return false;
  }
  return true;
}

/**
 * Se asegura de tener en el navegador los dias alrededor de esta fecha.
 * Devuelve una promesa; si ya estaba todo, no pide nada.
 */
function asegurarVentana(medicoId, fecha, fondo) {
  if (ventanaCubierta(medicoId, fecha)) return Promise.resolve(null);

  var desde = sumarDias(fecha, -VENTANA_ATRAS);
  var clave = medicoId + '|' + desde;
  if (RANGOS_PEDIDOS[clave]) return RANGOS_PEDIDOS[clave];

  var pedido = llamar('agenda.rango',
                      { medico_id: medicoId, desde: desde, dias: VENTANA_DIAS },
                      { fondo: !!fondo })
    .then(function (r) { guardarGrillas(r.medico_id, r.grillas); return r; })
    .catch(function (e) {
      // Que falle no puede dejar el rango marcado como pedido para siempre.
      delete RANGOS_PEDIDOS[clave];
      throw e;
    });

  RANGOS_PEDIDOS[clave] = pedido;
  return pedido;
}

function guardarGrillas(medicoId, grillas) {
  var ahora = Date.now();
  Object.keys(grillas).forEach(function (f) {
    var k = claveAgenda(medicoId, f);
    A.grillas[k] = grillas[f];
    A.sellos[k] = ahora;
  });
}

function montarAgenda(cont) {
  var medicos = S.sesion.catalogos.medicos;
  A.fecha = A.fecha || S.sesion.hoy || hoyLocal();

  if (!medicos.length) {
    cont.innerHTML =
      '<main><div class="caja aviso"><h3>Todavía no hay médicos cargados</h3>' +
      '<p>La agenda no puede mostrar nada hasta que se den de alta las especialidades, ' +
      'los consultorios, los médicos y sus horarios de atención.</p>' +
      (puede('config.catalogos')
        ? '<p><button class="btn principal" onclick="irA(\'config\')">Ir a Configuración</button></p>'
        : '<p>Pedile a un administrador que los cargue.</p>') +
      '</div></main>';
    return;
  }

  var puedeVerTodos = alcance('agenda.ver').indexOf('TODOS') >= 0;
  // Se prefiere el medico que el servidor ya resolvio para la agenda que
  // viene en sesion.iniciar: si acá se eligiera otro, esa agenda no serviria
  // y habria que pedirla de nuevo, que es justo lo que se quiere evitar.
  A.medicoId = A.medicoId ||
               (S.sesion.agenda_inicial && S.sesion.agenda_inicial.medico_id) ||
               S.sesion.usuario.medico_id || medicos[0].id;

  // La primera semana viaja adentro de sesion.iniciar: se guarda una sola
  // vez y con eso la pantalla inicial no pide nada.
  if (S.sesion.agenda_inicial) {
    guardarGrillas(S.sesion.agenda_inicial.medico_id, S.sesion.agenda_inicial.grillas);
    S.sesion.agenda_inicial = null;
  }

  A.modo = modoInicial();
  var esTablero = (A.modo === 'tablero');

  cont.innerHTML =
    '<div class="barra">' +
      (puedeVerTodos
        ? '<div class="nav-fechas modos">' +
            ['dia:Día', 'semana:Semana', 'tablero:Tablero'].map(function (m) {
              var id = m.split(':')[0];
              return '<button class="btn" data-modo="' + id + '"' +
                     (id === A.modo ? ' aria-current="page"' : '') + '>' +
                     m.split(':')[1] + '</button>';
            }).join('') +
          '</div>'
        : '') +
      '<select id="ag-medico" aria-label="Médico"' +
        ((puedeVerTodos && !esTablero) ? '' : ' disabled') + '>' +
        opciones(medicos, A.medicoId, function (m) { return m.apellido + ', ' + m.nombre; }) +
      '</select>' +
      '<div class="nav-fechas">' +
        '<button class="btn" id="ag-ant" title="Día anterior" aria-label="Día anterior">&#9664;</button>' +
        '<button class="btn" id="ag-hoy">Hoy</button>' +
        '<button class="btn" id="ag-sig" title="Día siguiente" aria-label="Día siguiente">&#9654;</button>' +
      '</div>' +
      '<input type="date" id="ag-fecha" value="' + txt(A.fecha) + '" aria-label="Fecha">' +
      (alcance('turno.sobreturno').length
        ? '<button class="btn chico sin-imprimir" id="ag-sobre" ' +
          'title="Urgencia fuera de agenda">Sobreturno</button>'
        : '') +
      botonesSalida('ag') +
      '<span class="sello" id="ag-sello"></span>' +
    '</div>' +
    '<main><div id="ag-avisos"></div><div id="ag-cuerpo">' +
      '<div class="cargando">Cargando agenda…</div></div></main>';

  $$('#vista .modos button').forEach(function (b) {
    b.addEventListener('click', function () { A.modo = this.dataset.modo; montarAgenda(cont); });
  });

  $('ag-medico').addEventListener('change', function () { A.medicoId = this.value; cargarAgenda(); });
  $('ag-fecha').addEventListener('change',  function () { A.fecha = this.value; cargarAgenda(); });
  $('ag-ant').addEventListener('click', function () { irAFecha(sumarDias(A.fecha, -1)); });
  $('ag-sig').addEventListener('click', function () { irAFecha(sumarDias(A.fecha,  1)); });
  $('ag-hoy').addEventListener('click', function () { irAFecha(S.sesion.hoy || hoyLocal()); });
  if ($('ag-sobre')) {
    $('ag-sobre').addEventListener('click', function () { nuevoSobreturno(A.medicoId, A.fecha); });
  }
  conectarBotonesSalida('ag',
    function () { imprimirPantalla(tituloAgenda()); },
    exportarAgenda);

  cargarAgenda();
  arrancarRefresco();
}

function desmontarAgenda() {
  if (S.timer) { clearInterval(S.timer); S.timer = null; }
}

function irAFecha(f) { A.fecha = f; if ($('ag-fecha')) $('ag-fecha').value = f; cargarAgenda(); }

/**
 * El refresco se detiene cuando la pestana queda en segundo plano y se
 * reanuda al volver. Recepcion suele tener varias pestanas abiertas: sin
 * esta pausa, las que nadie mira consumirian cuota igual.
 */
function arrancarRefresco() {
  desmontarAgenda();
  var seg = (S.sesion.config && S.sesion.config.segundos_refresco) || 30;
  S.timer = setInterval(function () {
    if (S.vista === 'agenda' && document.visibilityState === 'visible') cargarAgenda(true);
  }, seg * 1000);
}
document.addEventListener('visibilitychange', function () {
  if (S.vista === 'agenda' && document.visibilityState === 'visible') cargarAgenda(true);
});

/**
 * Trae el dia de TODOS los medicos en un solo pedido, mientras la persona ya
 * esta mirando su agenda.
 *
 * Recepcion cambia de medico todo el tiempo, y cada cambio costaba un viaje
 * entero. Con esto el desplegable responde al instante. Es un solo pedido
 * para todos los medicos, no uno por cada uno.
 */
function precargarTablero() {
  if (alcance('agenda.ver').indexOf('TODOS') < 0) return;   // el medico solo ve la suya
  var fecha = A.fecha;
  llamar('agenda.tablero', { fecha: fecha }, { fondo: true })
    .then(function (r) {
      r.columnas.forEach(function (c) {
        var g = {}; g[r.fecha] = c.agenda;
        guardarGrillas(c.medico.id, g);
      });
    })
    .catch(function () { /* es una comodidad: si falla, se pide cuando haga falta */ });
}

function sellarAgenda() {
  var h = new Date();
  if ($('ag-sello')) {
    $('ag-sello').textContent = 'act. ' + ('0'+h.getHours()).slice(-2) + ':' +
                                          ('0'+h.getMinutes()).slice(-2);
  }
}

/** Reparte según el modo. Los tres comparten barra, fecha y refresco. */
function cargarAgenda(silencioso) {
  if (A.modo === 'semana')  return cargarSemana(silencioso);
  if (A.modo === 'tablero') return cargarTablero(silencioso);
  return cargarDia(silencioso);
}

function cargarDia(silencioso) {
  if (!A.medicoId || !A.fecha) return;
  if (A.esperandoSesion) {
    if ($('ag-cuerpo')) $('ag-cuerpo').innerHTML = '<div class="cargando">Cargando agenda…</div>';
    return;
  }

  // Regla de la pantalla: nunca hacer esperar por algo que ya se tiene.
  // Si el dia ya vino en la semana que se trajo, se pinta al instante y, si
  // ya no es reciente, se corrige en segundo plano. La agenda cambia por lo
  // que hacen otros, asi que lo que esta a la vista siempre termina
  // confirmandose contra el servidor.
  var clave = claveAgenda(A.medicoId, A.fecha);
  var guardada = A.grillas[clave];
  var fresca = guardada && (Date.now() - (A.sellos[clave] || 0)) < FRESCA_MS;

  // El refresco automatico de fondo siempre pregunta: lo que cambia son los
  // turnos que cargan los demas, y eso tiene que llegar al dia.
  if (silencioso) { refrescarDia(true); return; }

  var medicoPedido = A.medicoId, fechaPedida = A.fecha;

  if (guardada) {
    // Se pinta de inmediato lo que ya se tiene y, si no es reciente, se
    // corrige en segundo plano. La persona no espera; si algo cambio, lo ve
    // aparecer un segundo despues.
    $('ag-avisos').innerHTML = '';
    pintarAgenda(guardada, false);
    sellarAgenda();
    if (!fresca) refrescarDia(true);
    // Y se traen por detras los dias de mas adelante, para que seguir
    // avanzando por el calendario tampoco pida nada.
    asegurarVentana(medicoPedido, fechaPedida, true).catch(function () {});
    return;
  }

  $('ag-cuerpo').innerHTML = '<div class="cargando">Cargando agenda…</div>';
  // Se piden dos semanas, no un dia: el costo esta en el viaje, no en los
  // datos, asi que traer de mas sale casi igual y evita el proximo viaje.
  asegurarVentana(medicoPedido, fechaPedida, false)
    .then(function () {
      if (S.vista !== 'agenda' || A.medicoId !== medicoPedido || A.fecha !== fechaPedida) return;
      var g = A.grillas[claveAgenda(medicoPedido, fechaPedida)];
      if (!g) { refrescarDia(false); return; }
      $('ag-avisos').innerHTML = '';
      pintarAgenda(g, false);
      sellarAgenda();
    })
    .catch(function (err) {
      // Si mientras tanto se cambió de médico, de fecha o de pantalla, este
      // error ya no es de nada que se esté mirando.
      if (S.vista !== 'agenda' || A.medicoId !== medicoPedido || A.fecha !== fechaPedida) return;
      if ($('ag-cuerpo')) $('ag-cuerpo').innerHTML = '';
      if ($('ag-avisos')) mostrarError(err, $('ag-avisos'), function () { cargarAgenda(); });
    });
}

/** Pide un solo dia y actualiza lo que hay en pantalla si sigue siendo el
 *  mismo. En segundo plano no molesta con errores: si fallo, en el proximo
 *  refresco se vuelve a intentar. */
function refrescarDia(silencioso) {
  var medicoId = A.medicoId, fecha = A.fecha;
  // Un refresco de fondo no puede hacer esperar a lo que la persona pidió.
  llamar('agenda.dia', { medico_id: medicoId, fecha: fecha }, { fondo: !!silencioso })
    .then(function (g) {
      var grillas = {}; grillas[fecha] = g;
      guardarGrillas(medicoId, grillas);
      if (S.vista !== 'agenda' || A.medicoId !== medicoId || A.fecha !== fecha) return;
      $('ag-avisos').innerHTML = '';
      pintarAgenda(g, true);
      sellarAgenda();
    })
    .catch(function (err) {
      if (silencioso) return;
      if ($('ag-cuerpo')) $('ag-cuerpo').innerHTML = '';
      if ($('ag-avisos')) mostrarError(err, $('ag-avisos'), function () { cargarAgenda(); });
    });
}

function pintarAgenda(g, silencioso) {
  var medico = medicoDe(g.medico_id) || {};
  var esp = nombreDe(S.sesion.catalogos.especialidades, medico.especialidad_id);

  // Huella para detectar si algo cambio: si no cambio, no se repinta y no
  // se pierde el destello ni la posicion del scroll.
  var huella = JSON.stringify(g.franjas.map(function (f) {
    return f.turno ? f.turno.id + f.turno.estado : '-';
  })) + JSON.stringify(g.sobreturnos.map(function (s) { return s.id + s.estado; }));
  var cambio = (A.huella !== null && A.huella !== huella);
  A.huella = huella;

  var html = '<div class="encabezado">' +
    '<h1>' + txt(medico.apellido ? (medico.apellido + ', ' + medico.nombre) : 'Agenda') + '</h1>' +
    '<div class="subtitulo">' + txt(fechaLarga(g.fecha)) + (esp ? ' · ' + txt(esp) : '') + '</div>' +
    '</div>';

  if (g.cerrado) {
    // El centro no abre. Es distinto de "este médico no atiende hoy", y la
    // pantalla tiene que decir cuál de las dos cosas es.
    html += '<div class="caja aviso"><h3>El centro está cerrado</h3>' +
            '<p>' + txt(g.cerrado.motivo) + '.</p>' +
            (g.fuera_de_plantilla && g.fuera_de_plantilla.length
              ? '<p><b>Atención:</b> hay ' + g.fuera_de_plantilla.length +
                ' turno(s) cargado(s) para este día, de antes de que se cerrara. ' +
                'Hay que reprogramarlos.</p>'
              : '') +
            (puede('config.sistema')
              ? '<p><button class="btn chico" onclick="irA(\'config\')">Ver feriados</button></p>'
              : '') +
            '</div>';
    if (g.fuera_de_plantilla) {
      g.fuera_de_plantilla.forEach(function (t) {
        html += '<div class="franja clicable" data-turno="' + txt(t.id) + '">' +
                '<div class="h">' + txt(t.hora) + '</div>' +
                '<div class="quien">' + datosPaciente(t) + '</div>' +
                insignia(t.estado) + '</div>';
      });
    }
    $('ag-cuerpo').innerHTML = html;
    conectarGrilla(g, g.medico_id, g.fecha);
    return;
  }

  if (!g.franjas.length && !g.sobreturnos.length) {
    html += '<div class="caja"><h3>No atiende este día</h3>' +
            '<p>No hay bloques de atención configurados para esta fecha.</p>' +
            (puede('config.plantillas')
              ? '<p><button class="btn chico" onclick="irA(\'config\')">Configurar horarios</button></p>' : '') +
            '</div>';
    $('ag-cuerpo').innerHTML = html;
    return;
  }

  // Los sobreturnos se dibujan colgados de su horario de referencia, con
  // marca propia, para que nadie los confunda con un turno regular.
  var porHora = {};
  g.sobreturnos.forEach(function (s) { (porHora[s.min_ini] = porHora[s.min_ini] || []).push(s); });

  html += '<div class="grilla">';
  g.franjas.forEach(function (f) {
    html += filaFranja(f, cambio);
    (porHora[f.min_ini] || []).forEach(function (s) { html += filaSobreturno(s, cambio); });
    delete porHora[f.min_ini];
  });
  Object.keys(porHora).forEach(function (k) {
    porHora[k].forEach(function (s) { html += filaSobreturno(s, cambio); });
  });
  html += '</div>';

  var r = g.resumen;
  html += '<div class="resumen">' + r.total + ' franjas · ' + r.ocupadas + ' ocupadas · ' +
          r.libres + ' libres · ' + r.ocupacion + ' % de ocupación' +
          (r.sobreturnos ? ' · ' + r.sobreturnos + ' sobreturno' + (r.sobreturnos > 1 ? 's' : '') : '') +
          '</div>';

  if (g.fuera_de_plantilla.length) {
    html += '<div class="caja aviso"><h3>' + g.fuera_de_plantilla.length +
      ' turno(s) fuera del horario configurado</h3>' +
      '<p>Quedaron afuera al cambiar la plantilla. <b>No se cancelaron:</b> hay que ' +
      'reprogramarlos uno por uno.</p><ul>' +
      g.fuera_de_plantilla.map(function (t) {
        return '<li>' + txt(t.hora + ' · ' + (t.paciente ? t.paciente.apellido + ', ' +
               t.paciente.nombre : 'paciente ' + t.paciente_id)) + '</li>';
      }).join('') + '</ul></div>';
  }
  if (g.bloqueos.length) {
    html += '<div class="caja"><h3>Bloqueos del día</h3><p>' +
      g.bloqueos.map(function (b) { return txt(b.motivo || 'Sin motivo'); }).join(' · ') +
      '</p></div>';
  }

  $('ag-cuerpo').innerHTML = html;
  conectarGrilla(g, g.medico_id, g.fecha);
}

function filaFranja(f, destello) {
  if (f.libre) {
    // Una franja libre es clicable solo si la persona puede dar turnos: si no,
    // hacer clic y que no pase nada es peor que no invitar al clic.
    var sePuede = puede('turno.crear');
    return '<div class="franja' + (sePuede ? ' clicable' : '') + '"' +
           (sePuede ? ' data-libre="' + txt(f.inicio) + '" tabindex="0" role="button"' +
                      ' title="Dar turno a las ' + txt(f.hora) + '"' : '') + '>' +
           '<div class="h">' + txt(f.hora) + '</div>' +
           '<div class="quien vacio">' + (sePuede ? 'libre · dar turno' : 'libre') + '</div>' +
           '<div></div></div>';
  }
  var t = f.turno;
  return '<div class="franja clicable' + (destello ? ' recien' : '') + '"' +
         ' data-turno="' + txt(t.id) + '" tabindex="0" role="button">' +
         '<div class="h">' + txt(f.hora) + '</div>' +
         '<div class="quien">' + datosPaciente(t) + '</div>' +
         insignia(t.estado) + '</div>';
}

function filaSobreturno(s, destello) {
  return '<div class="franja sobre clicable' + (destello ? ' recien' : '') + '"' +
         ' data-turno="' + txt(s.id) + '" tabindex="0" role="button">' +
         '<div class="h">' + txt(s.hora) + '</div>' +
         '<div class="quien">' + datosPaciente(s) +
         '<span>Sobreturno · ' + txt(s.motivo_sobreturno || 'sin motivo') + '</span></div>' +
         insignia(s.estado) + '</div>';
}

/**
 * Un solo escucha para toda la grilla, en lugar de uno por fila: la agenda se
 * redibuja cada 30 segundos y colgar decenas de escuchas cada vez es la forma
 * más fácil de que la pantalla se ponga pesada con el correr del día.
 */
function conectarGrilla(g, medicoId, fecha) {
  var cuerpo = $('ag-cuerpo');
  if (!cuerpo) return;

  function alActivar(e) {
    if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
    var fila = e.target.closest ? e.target.closest('.franja') : null;
    if (!fila) return;
    e.preventDefault();

    if (fila.dataset.libre) {
      var f = g.franjas.filter(function (x) { return x.inicio === fila.dataset.libre; })[0];
      if (f) darTurno(f, medicoId, fecha);
      return;
    }
    if (fila.dataset.turno) {
      var t = null;
      g.franjas.forEach(function (x) { if (x.turno && x.turno.id === fila.dataset.turno) t = x.turno; });
      g.sobreturnos.forEach(function (x) { if (x.id === fila.dataset.turno) t = x; });
      if (t) verTurno(t, medicoId, fecha);
    }
  }

  cuerpo.addEventListener('click', alActivar);
  cuerpo.addEventListener('keydown', alActivar);
}

function datosPaciente(t) {
  if (!t.paciente) return '<b class="vacio">Paciente no encontrado</b>';
  var p = t.paciente;
  var linea = nombreDe(S.sesion.catalogos.tipos_consulta, t.tipo_consulta_id) || '';
  // El telefono solo llega si el rol lo permite: si no vino, no se dibuja.
  if (p.telefono) linea += (linea ? ' · ' : '') + p.telefono;
  return '<b>' + txt(p.apellido + ', ' + p.nombre) + '</b>' +
         (linea ? '<span>' + txt(linea) + '</span>' : '');
}

// ---------------------------------------------------------------- salida
//
// Lo que se imprime y lo que se exporta es EXACTAMENTE lo que hay en
// pantalla: las mismas filas, ya recortadas por el rol. No se vuelve a pedir
// nada al servidor, así que no hay forma de que salga algo que la persona no
// estuviera viendo.

function tituloAgenda() {
  if (A.modo === 'tablero') return 'Tablero del centro · ' + fechaCorta(A.fecha);
  if (A.modo === 'semana') {
    var l = lunesDe(A.fecha);
    return 'Semana de ' + nombreMedico(A.medicoId) + ' · ' +
           fechaCorta(l) + ' al ' + fechaCorta(sumarDias(l, 6));
  }
  return 'Agenda de ' + nombreMedico(A.medicoId) + ' · ' + fechaCorta(A.fecha);
}

function exportarAgenda() {
  if (A.modo === 'tablero') return exportarTablero();
  if (A.modo === 'semana')  return exportarSemana();
  return exportarDia();
}

function filaDeTurno(t, medicoId) {
  return [
    nombreMedico(medicoId),
    t.hora,
    t.paciente ? (t.paciente.apellido + ', ' + t.paciente.nombre) : 'Paciente no encontrado',
    t.paciente ? (t.paciente.documento || '') : '',
    t.paciente ? (t.paciente.telefono || '') : '',
    nombreDe(S.sesion.catalogos.tipos_consulta, t.tipo_consulta_id),
    t.estado,
    t.es_sobreturno ? ('SOBRETURNO: ' + (t.motivo_sobreturno || '')) : '',
    t.nro_turno
  ];
}

var COLUMNAS_TURNO = ['Médico', 'Hora', 'Paciente', 'Documento', 'Teléfono',
                      'Tipo de consulta', 'Estado', 'Sobreturno', 'Turno'];

function exportarDia() {
  var g = A.grillas[claveAgenda(A.medicoId, A.fecha)];
  if (!g) { avisar('Esperá a que cargue la agenda.', 'error'); return; }
  var filas = [];
  g.franjas.forEach(function (f) {
    if (f.libre) filas.push([nombreMedico(A.medicoId), f.hora, '(libre)', '', '', '', '', '', '']);
    else filas.push(filaDeTurno(f.turno, A.medicoId));
  });
  g.sobreturnos.forEach(function (t) { filas.push(filaDeTurno(t, A.medicoId)); });

  exportarAHojaDeCalculo({
    accion: 'exportar.agenda', origen: 'agenda.dia',
    titulo: tituloAgenda(), subtitulo: fechaLarga(A.fecha),
    columnas: COLUMNAS_TURNO, filas: filas
  });
}

function exportarSemana() {
  var lunes = lunesDe(A.fecha);
  var medicoId = A.medicoId;
  var filas = [];
  for (var i = 0; i < 7; i++) {
    var f = sumarDias(lunes, i);
    var g = A.grillas[claveAgenda(A.medicoId, f)];
    if (!g) continue;
    if (g.cerrado) {
      // Igual que en pantalla: un día cerrado sin nada cargado no ocupa una
      // fila. Si tiene turnos pendientes de reprogramar, van todos.
      var pend = g.fuera_de_plantilla || [];
      if (!pend.length) continue;
      filas.push([fechaCorta(f), '', 'CERRADO · ' + g.cerrado.motivo, '', '', '', '', '', '']);
      pend.forEach(function (t) {
        filas.push([fechaCorta(f)].concat(filaDeTurno(t, medicoId).slice(1)));
      });
      continue;
    }
    g.franjas.forEach(function (fr) {
      if (fr.libre) return;
      filas.push([fechaCorta(f)].concat(filaDeTurno(fr.turno, A.medicoId).slice(1)));
    });
    g.sobreturnos.forEach(function (t) {
      filas.push([fechaCorta(f)].concat(filaDeTurno(t, A.medicoId).slice(1)));
    });
  }
  exportarAHojaDeCalculo({
    accion: 'exportar.agenda', origen: 'agenda.semana',
    titulo: tituloAgenda(),
    subtitulo: 'Del ' + fechaCorta(lunes) + ' al ' + fechaCorta(sumarDias(lunes, 6)),
    columnas: ['Fecha'].concat(COLUMNAS_TURNO.slice(1)), filas: filas
  });
}

function exportarTablero() {
  var filas = [];
  S.sesion.catalogos.medicos.forEach(function (m) {
    var g = A.grillas[claveAgenda(m.id, A.fecha)];
    if (!g) return;
    g.franjas.forEach(function (f) { if (!f.libre) filas.push(filaDeTurno(f.turno, m.id)); });
    g.sobreturnos.forEach(function (t) { filas.push(filaDeTurno(t, m.id)); });
  });
  exportarAHojaDeCalculo({
    accion: 'exportar.agenda', origen: 'agenda.tablero',
    titulo: tituloAgenda(), subtitulo: fechaLarga(A.fecha),
    columnas: COLUMNAS_TURNO, filas: filas
  });
}

/** El estado se codifica en texto ademas de color: distinguirlo solo por
 *  color falla con luz de sol en una tablet y con daltonismo. */
function insignia(estado) {
  return '<span class="estado e-' + txt(estado) + '">' + txt(estado) + '</span>';
}

// =====================================================================
//  Vista de semana.
//
//  No pide nada nuevo: se arma con los mismos dias que ya estan en el
//  navegador para la vista de dia. Cambiar de semana solo cuesta un pedido
//  cuando la semana cae fuera de lo ya traido.
// =====================================================================

/** Lunes de la semana de esa fecha. La semana laboral empieza el lunes. */
function lunesDe(fecha) {
  var p = fecha.split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  var dow = d.getDay();                    // 0 = domingo
  return sumarDias(fecha, dow === 0 ? -6 : 1 - dow);
}

function cargarSemana(silencioso) {
  if (!A.medicoId || !A.fecha || A.esperandoSesion) return;
  var lunes = lunesDe(A.fecha);
  var medicoPedido = A.medicoId;

  if (ventanaCubierta(medicoPedido, lunes)) { pintarSemana(medicoPedido, lunes); return; }
  if (silencioso) return;

  $('ag-cuerpo').innerHTML = '<div class="cargando">Cargando la semana…</div>';
  asegurarVentana(medicoPedido, lunes, false)
    .then(function () {
      if (S.vista !== 'agenda' || A.modo !== 'semana' || A.medicoId !== medicoPedido) return;
      pintarSemana(medicoPedido, lunes);
    })
    .catch(function (err) {
      if (S.vista !== 'agenda' || A.modo !== 'semana') return;
      mostrarError(err, $('ag-cuerpo'), function () { cargarSemana(); });
    });
}

function pintarSemana(medicoId, lunes) {
  var medico = medicoDe(medicoId) || {};
  var html = '<div class="encabezado">' +
    '<h1>' + txt(medico.apellido ? (medico.apellido + ', ' + medico.nombre) : 'Agenda') + '</h1>' +
    '<div class="subtitulo">Semana del ' + txt(fechaCorta(lunes)) + ' al ' +
      txt(fechaCorta(sumarDias(lunes, 6))) + '</div></div>';

  html += '<div class="semana">';
  var ocultos = [];
  for (var i = 0; i < 7; i++) {
    var f = sumarDias(lunes, i);
    var g = A.grillas[claveAgenda(medicoId, f)];
    var ocupados = [];
    if (g) {
      g.franjas.forEach(function (fr) { if (!fr.libre) ocupados.push(fr.turno); });
      ocupados = ocupados.concat(g.sobreturnos);
    }
    var atiende = g && (g.franjas.length || g.sobreturnos.length);
    var esHoy = (f === (S.sesion.hoy || hoyLocal()));
    var cerrado = g && g.cerrado;
    // En un día cerrado los turnos que sigan cargados no vienen en franjas:
    // vienen aparte, porque son de antes de que el día se cerrara.
    var sueltos = (g && g.fuera_de_plantilla) || [];

    // ------------------------------------------------------------------
    // Sábados, domingos y feriados sin nada cargado NO se dibujan.
    //
    // El CIC abre de lunes a viernes: dos columnas fijas diciendo "el centro
    // no abre" ocupaban un tercio de la semana para repetir algo que ya se
    // sabe, y en el papel era peor todavía. Se listan al pie en una línea.
    //
    // Un día cerrado que SÍ tiene turnos cargados se sigue mostrando, y con
    // más razón: son turnos que hay que reprogramar y esconderlos sería
    // exactamente el error que no se puede cometer.
    // ------------------------------------------------------------------
    if (cerrado && !ocupados.length && !sueltos.length) {
      ocultos.push(DIAS_SEMANA[i + 1] + ' ' + f.substring(8, 10) +
                   (cerrado.tipo === 'FERIADO' ? ' (' + cerrado.motivo + ')' : ''));
      continue;
    }

    // El rótulo va como TEXTO, no adentro del botón: la hoja de estilos de
    // impresión esconde los botones, y por eso en el papel las columnas
    // salían sin nombre ni número de día.
    html += '<div class="dia-semana' + (esHoy ? ' hoy' : '') +
      (cerrado ? ' cerrado' : '') + '">' +
      '<h4 class="rotulo clicable" data-dia="' + txt(f) + '" tabindex="0" role="button" ' +
        'title="Ver el día completo">' +
        txt(DIAS_SEMANA[i + 1] + ' ' + f.substring(8, 10)) + '</h4>';

    if (cerrado) {
      html += '<div class="vacio-msg">' + txt(cerrado.motivo) + '</div>';
      if (sueltos.length) {
        html += '<div class="cuenta alerta">' + sueltos.length +
                ' turno(s) a reprogramar</div>' +
                '<ul>' + sueltos.map(function (t) {
                  return '<li><span class="h">' + txt(t.hora) + '</span> ' +
                         txt(t.paciente ? (t.paciente.apellido + ', ' + t.paciente.nombre)
                                        : 'paciente') + '</li>';
                }).join('') + '</ul>';
      }
    } else if (!atiende) {
      html += '<div class="vacio-msg">No atiende</div>';
    } else {
      html += '<div class="cuenta">' + g.resumen.ocupadas + ' de ' + g.resumen.total +
              (g.resumen.sobreturnos ? ' +' + g.resumen.sobreturnos : '') + '</div>';
      html += ocupados.length
        ? '<ul>' + ocupados.map(function (t) {
            return '<li><span class="h">' + txt(t.hora) + '</span> ' +
                   txt(t.paciente ? (t.paciente.apellido + ', ' + t.paciente.nombre)
                                  : 'paciente') + '</li>';
          }).join('') + '</ul>'
        : '<div class="vacio-msg">Sin turnos</div>';
    }
    html += '</div>';
  }
  html += '</div>';

  if (ocultos.length) {
    html += '<div class="pie-semana">Cerrado: ' + txt(ocultos.join(' · ')) + '</div>';
  }

  $('ag-avisos').innerHTML = '';
  $('ag-cuerpo').innerHTML = html;
  sellarAgenda();

  $$('#ag-cuerpo [data-dia]').forEach(function (b) {
    function ir(e) {
      if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      A.modo = 'dia';
      A.fecha = b.dataset.dia;
      montarAgenda($('vista'));
    }
    b.addEventListener('click', ir);
    b.addEventListener('keydown', ir);
  });
}

// =====================================================================
//  Tablero de recepcion: el dia entero del centro, todos los medicos.
// =====================================================================

function cargarTablero(silencioso) {
  if (!A.fecha || A.esperandoSesion) return;
  var fechaPedida = A.fecha;

  // Si el dia de todos los medicos ya esta en el navegador -- lo deja la
  // precarga del arranque -- se dibuja sin pedir nada.
  var activos = S.sesion.catalogos.medicos;
  var todosEnMemoria = activos.length && activos.every(function (m) {
    return !!A.grillas[claveAgenda(m.id, fechaPedida)];
  });
  if (todosEnMemoria) { pintarTablero(fechaPedida); if (!silencioso) return; }
  if (silencioso && todosEnMemoria) return;

  if (!todosEnMemoria) $('ag-cuerpo').innerHTML = '<div class="cargando">Cargando el día…</div>';
  llamar('agenda.tablero', { fecha: fechaPedida }, { fondo: !!silencioso })
    .then(function (r) {
      r.columnas.forEach(function (c) {
        var g = {}; g[r.fecha] = c.agenda;
        guardarGrillas(c.medico.id, g);
      });
      if (S.vista !== 'agenda' || A.modo !== 'tablero' || A.fecha !== fechaPedida) return;
      pintarTablero(fechaPedida, r.totales);
    })
    .catch(function (err) {
      if (silencioso || S.vista !== 'agenda' || A.modo !== 'tablero') return;
      mostrarError(err, $('ag-cuerpo'), function () { cargarTablero(); });
    });
}

function pintarTablero(fecha, totales) {
  var columnas = S.sesion.catalogos.medicos.map(function (m) {
    return { medico: m, agenda: A.grillas[claveAgenda(m.id, fecha)] };
  }).filter(function (c) {

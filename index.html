<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  /* ================================================================
     PALETA — sale del logo del CIC 2.

     Se aprobó en la muestra de diseño (codigo/muestra-diseno.html) antes de
     tocar nada acá. Todo color del sistema sale de estas variables: si algún
     estilo escribe un color a mano, es un error, porque no va a cambiar con
     el tema y va a quedar ilegible en uno de los dos.
     ================================================================ */
  :root{
    --acento:#15607F; --acento-ink:#0E4459; --acento-suave:#E1EDF3;
    --cielo:#4FA8C9;
    --paper:#F4F6F8; --surface:#FFFFFF; --surface-2:#EAEFF3;
    --ink:#10222B; --muted:#55707E; --faint:#8AA0AB;
    --rule:#DBE3E9; --rule-fuerte:#BECCD5;
    --ok:#1F7A4D; --ok-suave:#E4F1EA;
    --aviso:#9A6410; --aviso-suave:#F7EEDF;
    --alerta:#A32721; --alerta-suave:#F8E7E5;
    /* El texto que va ENCIMA del acento. En claro el acento es oscuro y pide
       texto blanco; en oscuro es claro y pide texto oscuro. Un #fff fijo
       desaparecía en modo oscuro. */
    --sobre-acento:#FFFFFF;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
    --mono:"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
    --sombra:0 1px 2px rgba(16,34,43,.06), 0 14px 30px -22px rgba(16,34,43,.45);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --acento:#62BEDD; --acento-ink:#96D8EF; --acento-suave:#10333F;
      --cielo:#7FCFE8;
      --paper:#0C1418; --surface:#131E24; --surface-2:#1A272F;
      --ink:#E4EDF1; --muted:#93A9B4; --faint:#6E8590;
      --rule:#253339; --rule-fuerte:#35474F;
      --ok:#63B981; --ok-suave:#152B20;
      --aviso:#D5A052; --aviso-suave:#2C2415;
      --alerta:#E8918A; --alerta-suave:#331B19;
      --sobre-acento:#08161C;
      --sombra:0 1px 2px rgba(0,0,0,.5), 0 14px 30px -22px rgba(0,0,0,.9);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;}
  button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--acento);outline-offset:2px;}

  /* ---------------- cabecera ---------------- */
  header{
    background:var(--surface);border-bottom:1px solid var(--rule-fuerte);
    padding:9px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    position:sticky;top:0;z-index:30;
  }
  .marca{font-weight:700;letter-spacing:-.015em;line-height:1.25;font-size:19px;
         display:flex;align-items:center;gap:12px;}
  .marca small{display:block;font-weight:500;font-size:11px;color:var(--muted);
               letter-spacing:.11em;text-transform:uppercase;
               margin-top:5px;line-height:1.2;}
  /* El logo es redondo y sobre fondo blanco. En modo oscuro se le deja un
     anillo claro para que no quede recortado contra la barra. */
  .marca .logo{width:46px;height:46px;border-radius:50%;display:block;flex:none;
               background:#fff;box-shadow:0 0 0 1px var(--rule);}
  nav.menu{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap;}
  nav.menu button{
    background:transparent;border:1px solid transparent;border-radius:4px;
    padding:7px 12px;color:var(--muted);min-height:38px;
  }
  nav.menu button:hover{background:var(--surface-2);color:var(--ink);}
  nav.menu button[aria-current="page"]{
    background:var(--acento-suave);color:var(--acento-ink);border-color:var(--acento);font-weight:600;
  }
  .yo{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);
      white-space:nowrap;margin-left:auto;}
  .build{font-family:var(--mono);font-size:10.5px;color:var(--faint);}

  /* Quién está conectado no es un detalle en una computadora compartida: es la
     respuesta a "¿estoy cargando esto con MI usuario?". Por eso destaca. */
  .quien-soy{display:inline-flex;align-items:center;gap:7px;
             background:var(--acento-suave);color:var(--acento-ink);
             border:1px solid var(--acento);border-radius:999px;
             padding:5px 12px 5px 6px;font-weight:640;font-size:13.5px;
             max-width:230px;min-width:0;}
  .quien-soy .inicial{width:24px;height:24px;border-radius:50%;flex:none;
                      background:var(--acento);color:var(--sobre-acento);
                      display:grid;place-items:center;font-size:12px;font-weight:700;}
  .quien-soy .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------------- controles ---------------- */
  /* ================================================================
     TODOS los campos, no una lista de tipos.

     La lista anterior nombraba text, date, time, number y email — y se
     olvidaba de `tel`. Los teléfonos y la obra social quedaban con el
     estilo de fábrica del navegador: más bajos, con otro borde, y en un
     formulario al lado de los demás se veía torcido. Un campo nuevo con un
     tipo no listado volvería a romperlo.

     Ahora entran todos y se excluyen los tres que NO son cajas de texto.
     `field-sizing` evita además que el navegador les dé un ancho propio
     según el tipo, que era la otra fuente de desprolijidad.
     ================================================================ */
  select, textarea,
  input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=hidden]){
    padding:7px 9px;background:var(--surface);border:1px solid var(--rule-fuerte);
    border-radius:4px;min-height:38px;max-width:100%;
    font-size:14px;line-height:1.4;
  }
  /* Adentro de un formulario, el campo ocupa su columna entera. Afuera —el
     selector de la barra, el buscador— manda el ancho que le dé su lugar. */
  .campo select, .campo textarea,
  .campo input:not([type=checkbox]):not([type=radio]){ width:100%; }
  input[type=date]{min-width:0;}
  textarea{min-height:70px;resize:vertical;line-height:1.45;}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px;}
  .campo{margin-bottom:12px;}
  .campo .ayuda{font-size:12px;color:var(--faint);margin-top:3px;}
  .fila{display:flex;gap:12px;flex-wrap:wrap;}
  .fila > *{flex:1 1 150px;min-width:0;}

  .btn{
    background:var(--surface);border:1px solid var(--rule-fuerte);border-radius:4px;
    padding:8px 14px;min-height:38px;font-weight:500;
  }
  .btn:hover{background:var(--surface-2);}
  .btn.principal{background:var(--acento);border-color:var(--acento);
                 color:var(--sobre-acento);}
  .btn.principal:hover{background:var(--acento-ink);border-color:var(--acento-ink);}
  .btn.peligro{color:var(--alerta);border-color:var(--alerta);}
  .btn.chico{padding:4px 9px;min-height:30px;font-size:13px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}
  .nav-fechas{display:flex;}
  .nav-fechas .btn{border-radius:0;margin-left:-1px;}
  .nav-fechas .btn:first-child{border-radius:4px 0 0 4px;margin-left:0;}
  .nav-fechas .btn:last-child{border-radius:0 4px 4px 0;}

  /* ---------------- estructura ---------------- */
  .barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
         padding:12px 16px;border-bottom:1px solid var(--rule);background:var(--surface);}
  .sello{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--faint);}
  main{padding:16px;max-width:1000px;margin:0 auto;}
  h1{font-size:19px;margin:0;font-weight:600;}
  h2{font-size:16px;margin:0 0 10px;font-weight:600;}
  .subtitulo{font-size:13px;color:var(--muted);}
  .encabezado{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;
              margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--rule);}
  /* La cabecera de la vista de día: la FECHA es el dato principal. */
  .encabezado.dia{align-items:flex-start;}
  .encabezado .ubica{min-width:0;}
  .fecha-grande{margin:0;font-size:22px;line-height:1.15;font-weight:720;
                color:var(--acento);letter-spacing:-.015em;
                font-variant-numeric:tabular-nums;}
  .encabezado.dia h1{margin:3px 0 0;font-size:18px;}
  .encabezado.dia .subtitulo{margin-top:1px;}
  @media (max-width:560px){ .fecha-grande{font-size:19px;} }
  .encabezado .der{margin-left:auto;}
  section.bloque{background:var(--surface);border:1px solid var(--rule);border-radius:6px;
                 padding:16px;margin-bottom:16px;}
  section.bloque > h2{display:flex;align-items:center;gap:10px;}
  section.bloque > h2 .der{margin-left:auto;font-weight:400;}

  /* ---------------- grilla de agenda ---------------- */
  .grilla{display:flex;flex-direction:column;border:1px solid var(--rule);
          background:var(--surface);border-radius:6px;overflow:hidden;}
  /* ================================================================
     LA FRANJA — la fila que más se mira de todo el sistema.

     Dos decisiones que se aprobaron en la muestra:

     · La HORA en 22 px, monoespaciada y con cifras de ancho fijo. El día se
       recorre de un vistazo en vez de leerlo renglón por renglón. Cuesta
       unos dos turnos menos por pantalla, y vale la pena.
     · Una CINTA de color a la izquierda por estado. Así el estado se ve
       antes de leerse: mirando la columna se sabe cómo viene el día sin
       leer una sola palabra. La etiqueta de texto se queda igual — el color
       solo nunca alcanza, ni con sol en la pantalla ni para quien no
       distingue bien los tonos.
     ================================================================ */
  .franja{display:grid;grid-template-columns:6px 74px 1fr auto;gap:0 14px;
          grid-template-areas:"c h q e";align-items:center;
          min-height:56px;padding:8px 12px 8px 0;
          border-bottom:1px solid var(--rule);}
  .franja:last-child{border-bottom:0;}
  .franja .cinta{grid-area:c;align-self:stretch;background:transparent;
                 border-radius:0 3px 3px 0;}
  .franja .h{grid-area:h;font-family:var(--mono);font-size:22px;font-weight:600;
             color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .franja .quien{grid-area:q;min-width:0;overflow-wrap:anywhere;}
  .franja .estado{grid-area:e;}
  .franja .quien b{font-weight:600;font-size:15px;display:block;}
  .franja .quien span{display:block;font-size:13px;color:var(--muted);margin-top:1px;}
  .franja .vacio{color:var(--faint);font-style:italic;}

  /* El estado, en color. Reservado azul, atendido verde, ausente ámbar,
     cancelado gris: los mismos colores que las etiquetas. */
  .franja.est-RESERVADO .cinta{background:var(--acento);}
  .franja.est-ATENDIDO  .cinta{background:var(--ok);}
  .franja.est-AUSENTE   .cinta{background:var(--aviso);}
  .franja.est-CANCELADO .cinta{background:var(--rule-fuerte);}
  .franja.est-REPROGRAMADO .cinta{background:var(--rule-fuerte);}
  /* Lo que ya pasó se apaga: hace resaltar lo que queda por atender. */
  .franja.est-ATENDIDO .quien b{color:var(--muted);font-weight:520;}
  .franja.est-ATENDIDO .h{color:var(--faint);font-weight:500;}
  .franja.est-CANCELADO .quien b,
  .franja.est-REPROGRAMADO .quien b{text-decoration:line-through;color:var(--faint);}
  .franja.est-CANCELADO .h,
  .franja.est-REPROGRAMADO .h{color:var(--faint);}

  .franja.libre{min-height:46px;}
  .franja.libre .h{color:var(--faint);font-weight:500;}
  .franja.libre .cinta{background:transparent;}
  .franja.libre.clicable:hover .cinta{background:var(--cielo);}

  .franja.sobre{background:var(--aviso-suave);}
  .franja.sobre .cinta{background:var(--aviso);}
  .franja.sobre .h::before{content:"+";color:var(--aviso);font-weight:700;margin-right:2px;}
  /* Una fila en la que se puede hacer algo tiene que parecerlo, y tiene que
     poder usarse con el teclado: en un mostrador se trabaja más rápido con
     tabulador y Enter que buscando el mouse. */
  .franja.clicable{cursor:pointer;}
  .franja.clicable:hover{background:var(--acento-suave);}
  .franja.libre.clicable:hover .quien{color:var(--acento-ink);font-weight:560;}
  .franja.clicable:focus-visible{outline:2px solid var(--acento);outline-offset:-2px;}
  .franja.recien{animation:destello 1.6s ease-out;}
  @keyframes destello{from{background:var(--acento-suave);} to{background:transparent;}}

  /* Semana y tablero: columnas que se acomodan solas al ancho disponible.
     Con auto-fit el teléfono termina con una sola columna sin reglas aparte. */
  .semana,.tablero{display:grid;gap:10px;margin-top:4px;
                   grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
  .dia-semana,.col-medico{border:1px solid var(--rule);border-radius:5px;padding:8px 10px;
                          background:var(--surface);min-width:0;}
  .dia-semana.hoy{border-color:var(--acento);box-shadow:inset 0 0 0 1px var(--acento);}
  /* Un dia cerrado se distingue de un dia sin turnos: son cosas distintas. */
  .dia-semana.cerrado{background:var(--surface-2);}
  .dia-semana.cerrado h4.rotulo{color:var(--faint);}
  .dia-semana h4,.col-medico h4{margin:0 0 4px;font-size:13px;}
  /* El rotulo es TEXTO, no un boton: los botones no se imprimen, y por eso
     antes el papel salia con columnas sin nombre de dia ni de medico. */
  h4.rotulo{border-bottom:1px solid var(--rule);padding-bottom:4px;}
  /* ================================================================
     EL DIA, EN LA CABECERA DE CADA COLUMNA DE LA SEMANA

     El numero grande y el nombre del dia debajo. La semana se recorre
     buscando "el martes" o "el 9", no leyendo siete renglones del mismo
     tamano. Y HOY se dice con una palabra ademas del borde de color: con
     siete columnas, un borde se pierde. */
  .dia-semana h4.rotulo{display:flex;align-items:baseline;gap:7px;}
  .dia-semana .dia-num{font-family:var(--mono);font-size:21px;font-weight:700;
                       line-height:1;color:var(--ink);
                       font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .dia-semana .dia-nom{font-size:12px;font-weight:600;color:var(--muted);}
  .dia-semana.hoy .dia-num{color:var(--acento);}
  .pill.hoy{margin-left:auto;background:var(--acento);color:var(--sobre-acento);
            font-weight:700;letter-spacing:.04em;}
  .dia-semana.cerrado .dia-num{color:var(--faint);}
  /* La cabecera de columna del tablero se queda a la vista mientras se
     recorre un dia largo: una lista de veinte turnos sin saber de quien es
     obliga a subir cada vez. */
  .col-medico h4.rotulo{position:sticky;top:0;z-index:1;background:var(--surface);}
  h4.rotulo small{display:block;font-weight:400;font-size:11px;color:var(--muted);}
  h4.rotulo.clicable{cursor:pointer;}
  h4.rotulo.clicable:hover{color:var(--acento);}
  h4.rotulo.clicable:focus-visible{outline:2px solid var(--acento);outline-offset:2px;}
  .cuenta.alerta{color:var(--alerta) !important;font-weight:600;}
  .pie-semana{margin-top:10px;font-size:12px;color:var(--muted);}

  /* ================================================================
     LOS INTERRUPTORES DE PROFESIONAL DEL TABLERO

     Con diez profesionales el tablero son diez columnas angostas y recepcion
     mira tres. Apagar el resto es lo que hace usable la pantalla.

     Ocultar turnos es delicado, asi que el apagado se VE: el boton se queda
     en su lugar, tachado y en gris, con la cantidad de turnos al lado. Nunca
     desaparece nadie de la lista de botones; lo unico que desaparece es su
     columna, y arriba dice cuantos hay apagados.
     ================================================================ */
  .filtro-medicos{display:flex;flex-wrap:wrap;align-items:center;gap:6px;
                  margin-bottom:12px;padding-bottom:10px;
                  border-bottom:1px solid var(--rule);}
  .filtro-medicos .rot{font-size:11px;letter-spacing:.06em;text-transform:uppercase;
                       color:var(--muted);font-weight:600;margin-right:2px;}
  .chip{display:inline-flex;align-items:center;gap:6px;
        background:var(--acento-suave);border:1px solid var(--acento);
        color:var(--acento-ink);border-radius:14px;padding:4px 10px;
        min-height:28px;font-size:12.5px;font-weight:560;cursor:pointer;
        white-space:nowrap;}
  .chip .n{font-family:var(--mono);font-size:11px;font-weight:600;opacity:.75;
           font-variant-numeric:tabular-nums;}
  .chip:hover{border-color:var(--acento-ink);}
  .chip:focus-visible{outline:2px solid var(--acento);outline-offset:2px;}
  .chip.apagado{background:var(--surface-2);border-color:var(--rule-fuerte);
                color:var(--faint);text-decoration:line-through;font-weight:400;}
  .chip.apagado .n{text-decoration:none;}
  .filtro-medicos .aviso-oculto{font-size:12px;color:var(--aviso);font-weight:600;
                                margin-left:auto;}
  /* Ficha del paciente: rotulo a la izquierda, dato a la derecha. */
  td.rotulo-dato{color:var(--muted);font-size:13px;width:34%;white-space:nowrap;}
  td.dato .ayuda{display:block;font-size:11.5px;color:var(--faint);}
  label.en-linea{display:inline-flex;align-items:center;gap:6px;margin:0;
                 font-size:13px;white-space:nowrap;}
  .lista-cuentas{list-style:none;margin:10px 0;padding:0;}
  .lista-cuentas li{display:flex;align-items:center;gap:10px;padding:4px 0;}
  .lista-cuentas .ayuda{margin:0;}
  .dia-semana .cuenta,.col-medico .cuenta{font-family:var(--mono);font-size:11.5px;
                                          color:var(--muted);margin-bottom:6px;
                                          font-variant-numeric:tabular-nums;
                                          display:flex;align-items:center;gap:8px;}
  /* ================================================================
     LA BARRA DE OCUPACIÓN

     Cambia de color a medida que se llena. Una agenda llena NO es un
     problema —es lo deseable—, pero en el mostrador significa una parada en
     seco: hay que ofrecer otro día u otro profesional. Por eso el 100 % va
     en rojo y además dice COMPLETO: un rojo y un ámbar en una barra de seis
     píxeles se parecen demasiado para confiarle algo así solo al color.
     ================================================================ */
  .medidor{flex:1;height:6px;border-radius:3px;background:var(--surface-2);
           overflow:hidden;min-width:38px;}
  .medidor i{display:block;height:100%;background:var(--acento);
             transition:width .25s ease, background-color .25s ease;}
  .medidor.q1 i{background:var(--cielo);}     /* hasta 40 % */
  .medidor.q2 i{background:var(--acento);}    /* 40-69 % */
  .medidor.q3 i{background:#C08A2E;}          /* 70-89 % */
  .medidor.q4 i{background:var(--aviso);}     /* 90-99 % */
  .medidor.q5 i{background:var(--alerta);}    /* 100 % */
  @media (prefers-color-scheme:dark){ .medidor.q3 i{background:#C9973F;} }
  .completo{color:var(--alerta);font-weight:700;letter-spacing:.03em;}
  .dia-semana ul,.col-medico ul{list-style:none;margin:0;padding:0;}
  .dia-semana li,.col-medico li{font-size:12.5px;padding:3px 0;
                                border-bottom:1px solid var(--rule);
                                overflow-wrap:anywhere;}
  .dia-semana li:last-child,.col-medico li:last-child{border-bottom:0;}
  .col-medico li[data-turno]{cursor:pointer;}
  .col-medico li[data-turno]:hover{background:var(--acento-suave);}
  .col-medico li.libre{color:var(--faint);font-style:italic;}
  .col-medico li.libre.clicable{cursor:pointer;}
  .col-medico li.libre.clicable:hover{background:var(--acento-suave);color:var(--acento-ink);
                                      font-style:normal;}
  .col-medico li.libre.clicable:focus-visible{outline:2px solid var(--acento);outline-offset:-2px;}
  .col-medico li.sobre{background:var(--aviso-suave);}
  .dia-semana li.sobre .h{color:var(--aviso);font-weight:700;}
  .dia-semana li .h,.col-medico li .h{font-family:var(--mono);color:var(--muted);}
  /* El estado, tambien en las listas compactas: lo cancelado tachado y lo
     atendido apagado, igual que en la franja de la vista de dia. Sin esto una
     columna de cancelados se lee igual de ocupada que una de pacientes por
     atender, que es justo la lectura que no puede fallar. */
  .dia-semana li.est-ATENDIDO,.col-medico li.est-ATENDIDO{color:var(--muted);}
  .dia-semana li.est-CANCELADO,.col-medico li.est-CANCELADO,
  .dia-semana li.est-REPROGRAMADO,.col-medico li.est-REPROGRAMADO{
    color:var(--faint);text-decoration:line-through;}
  .dia-semana li.est-AUSENTE .h,.col-medico li.est-AUSENTE .h{color:var(--aviso);}
  .col-medico li.clicable{cursor:pointer;}
  .col-medico li.clicable:focus-visible{outline:2px solid var(--acento);outline-offset:-2px;}
  /* El tablero necesita más ancho que una agenda de un solo profesional. Si el
     navegador no entiende :has(), queda en el ancho normal y se sigue viendo
     bien: es más angosto, no roto. */
  main:has(.tablero),main:has(.semana),main:has(.ancha){max-width:1400px;}

  /* Usuarios y roles: entraba solo con scroll horizontal, y una tabla de
     permisos que hay que arrastrar para leer es una tabla que nadie revisa.
     Las columnas de rol se aprietan al ancho del titulo, el correo puede
     partirse, y lo que sobra se lo lleva el nombre. */
  table.usuarios{table-layout:auto;}
  table.usuarios th.rol-col,table.usuarios td.rol-col{
    text-align:center;width:1%;white-space:nowrap;padding-left:6px;padding-right:6px;
    font-size:12px;
  }
  table.usuarios td:first-child{overflow-wrap:anywhere;font-size:12.5px;}
  @media (max-width:900px){
    table.usuarios th.rol-col{writing-mode:vertical-rl;transform:rotate(180deg);
                              white-space:nowrap;padding:6px 2px;}
  }

  .estado{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;
          padding:2px 7px;border:1px solid currentColor;border-radius:3px;white-space:nowrap;}
  .e-RESERVADO{color:var(--acento);}
  .e-ATENDIDO{color:var(--ok);}
  .e-AUSENTE{color:var(--alerta);}
  .e-CANCELADO,.e-REPROGRAMADO{color:var(--faint);}
  .resumen{margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--muted);
           font-variant-numeric:tabular-nums;}

  /* ---------------- tablas ---------------- */
  .tabla-cont{overflow-x:auto;border:1px solid var(--rule);border-radius:6px;background:var(--surface);}
  table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:480px;}
  th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--rule);vertical-align:middle;}
  thead th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
           font-weight:600;background:var(--surface-2);white-space:nowrap;}
  tbody tr:last-child td{border-bottom:0;}
  tbody tr.inactiva{opacity:.5;}
  td.acciones{text-align:right;white-space:nowrap;}
  td.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px;}
  /* ================================================================
     LISTADOS LARGOS: SCROLL PROPIO Y ENCABEZADO FIJO

     El padron se recorre con la vista, no con la barra del navegador. Con
     scroll propio la barra de busqueda y el paginado quedan siempre a la
     vista, y el encabezado pegado arriba evita la pregunta de siempre:
     "¿esta columna cual era?" a los treinta renglones.
     ================================================================ */
  .tabla-scroll{max-height:62vh;overflow:auto;}
  .tabla-scroll thead th{position:sticky;top:0;z-index:2;}
  td .tel-alt{display:block;color:var(--muted);font-size:11.5px;}
  /* El paginado: cuantos se ven, cuales se ven y como pasar de pagina. */
  .paginado{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
            margin-bottom:10px;font-size:13px;}
  .paginado select{min-height:32px;padding:4px 8px;}
  .paginado .rango{font-family:var(--mono);font-size:12px;color:var(--muted);
                   font-variant-numeric:tabular-nums;}
  .paginado .nav-fechas{margin-left:auto;}
  .paginado #pac-pag{font-family:var(--mono);font-variant-numeric:tabular-nums;
                     opacity:1;cursor:default;min-width:64px;}

  /* ================================================================
     LA FICHA DEL PACIENTE

     Se abre con el telefono en la mano o con la persona enfrente. Antes era
     una lista de once renglones donde el documento y el correo pesaban lo
     mismo; ahora los datos que identifican a la persona van en tarjetas que
     se leen de un vistazo, y el contacto abajo, aparte.
     ================================================================ */
  .titulo-bloque{font-size:12px;letter-spacing:.06em;text-transform:uppercase;
                 color:var(--muted);font-weight:600;margin:18px 0 8px;}
  .ficha-datos{display:grid;gap:10px;margin-bottom:4px;
               grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .ficha-datos.una{grid-template-columns:1fr;}
  .dato-tarjeta{border:1px solid var(--rule);border-radius:5px;padding:8px 11px;
                background:var(--surface-2);min-width:0;}
  .dato-tarjeta .rot{display:block;font-size:11px;letter-spacing:.05em;
                     text-transform:uppercase;color:var(--muted);font-weight:600;}
  .dato-tarjeta .val{display:block;margin-top:3px;font-size:15px;font-weight:560;
                     overflow-wrap:anywhere;}
  .dato-tarjeta.grande .val{font-family:var(--mono);font-size:17px;font-weight:600;
                            font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
  .dato-tarjeta .val.vacio{color:var(--faint);font-style:italic;font-weight:400;
                           font-size:14px;font-family:inherit;letter-spacing:0;}
  .dato-tarjeta .pie{display:block;margin-top:2px;font-size:11.5px;color:var(--faint);}
  .dato-tarjeta .val .tel-alt{display:block;font-size:14px;color:var(--muted);margin-top:2px;}
  .dato-tarjeta .val .ayuda{display:block;font-size:11.5px;color:var(--faint);
                            font-weight:400;font-family:inherit;letter-spacing:0;}
  /* Los turnos pasados de la ficha, con el mismo codigo que la agenda. */
  tbody tr.est-CANCELADO td,tbody tr.est-REPROGRAMADO td{color:var(--faint);}
  tbody tr.est-ATENDIDO td{color:var(--muted);}

  /* ---------------- avisos ---------------- */
  .caja{padding:12px 14px;border-left:3px solid var(--rule-fuerte);margin-bottom:14px;
        font-size:14px;border-radius:0 4px 4px 0;background:var(--surface);}
  .caja.error{border-color:var(--alerta);background:var(--alerta-suave);}
  .caja.aviso{border-color:var(--aviso);background:var(--aviso-suave);}
  .caja.ok{border-color:var(--acento);background:var(--acento-suave);}
  .caja h3{margin:0 0 4px;font-size:14px;font-weight:600;}
  .caja p{margin:0 0 6px;}
  .caja p:last-child{margin-bottom:0;}
  .caja ul{margin:6px 0 0;padding-left:20px;}
  .caja code{font-family:var(--mono);font-size:12.5px;}

  .vacio-msg{padding:26px;text-align:center;color:var(--muted);font-size:14px;}
  .cargando{padding:26px;text-align:center;color:var(--muted);font-size:14px;}

  /* ---------------- avisos flotantes ---------------- */
  #avisos-flotantes{position:fixed;right:16px;bottom:16px;z-index:60;
                    display:flex;flex-direction:column;gap:8px;max-width:380px;}
  .flotante{background:var(--surface);border:1px solid var(--rule-fuerte);border-left-width:3px;
            border-radius:5px;padding:10px 14px;box-shadow:var(--sombra);font-size:14px;}
  .flotante.ok{border-left-color:var(--acento);}
  .flotante.error{border-left-color:var(--alerta);}

  /* ---------------- diálogo ---------------- */
  .fondo-modal{position:fixed;inset:0;background:rgba(10,14,12,.55);z-index:50;
               display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;
               overflow-y:auto;}
  .modal{background:var(--surface);border-radius:8px;box-shadow:var(--sombra);
         width:100%;max-width:560px;margin:auto;}
  .modal header{position:static;border-radius:8px 8px 0 0;padding:14px 18px;
                border-bottom:1px solid var(--rule);}
  .modal .cuerpo{padding:18px;}
  .modal .pie{padding:14px 18px;border-top:1px solid var(--rule);
              display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
  .modal h2{margin:0;}

  /* Columnas de valores del registro de auditoría: son cadenas largas y sin
     esto una sola fila estira la tabla entera. */
  td.dato{font-size:12px;color:var(--ink);max-width:280px;overflow-wrap:anywhere;
          line-height:1.45;}
  td.dato > div{padding:1px 0;}
  .campo-aud{color:var(--muted);}
  .faint{color:var(--faint);}

  /* ---------------- cortina de inactividad ---------------- */
  .cortina{position:fixed;inset:0;z-index:80;background:var(--paper);
           display:flex;align-items:center;justify-content:center;padding:24px;}
  .caja-cortina{background:var(--surface);border:1px solid var(--rule-fuerte);
                border-radius:8px;padding:28px 32px;box-shadow:var(--sombra);
                max-width:440px;text-align:center;}
  .caja-cortina h2{margin:0 0 8px;}
  .caja-cortina p{color:var(--muted);}

  /* ---------------- impresion ----------------
     En el papel no van la barra, el menu ni los botones: va el contenido.
     Las tablas no se pueden cortar en dos hojas por la mitad de una fila. */
  @media print{
    header,.barra,.sello,.sin-imprimir,#avisos-flotantes,.fondo-modal,
    nav.menu,.btn,.cortina{display:none !important;}
    body{background:#fff;color:#000;font-size:11pt;}
    main{max-width:none;padding:0;}
    section.bloque{border:0;padding:0;margin:0 0 12pt;break-inside:avoid;}
    .caja{border:1px solid #999;padding:8pt;}
    table{width:100%;border-collapse:collapse;}
    th,td{border:1px solid #bbb;padding:3pt 5pt;font-size:9.5pt;}
    thead{display:table-header-group;}          /* el encabezado se repite */
    /* En papel no hay scroll: la lista se imprime entera, no la altura de la
       pantalla. Y el encabezado pegado se vuelve encabezado repetido. */
    .tabla-scroll{max-height:none;overflow:visible;}
    .tabla-scroll thead th{position:static;}
    .dato-tarjeta{border:1px solid #bbb;background:#fff;}
    tr,.franja,.dia-semana,.col-medico{break-inside:avoid;}
    .grilla{border:1px solid #999;}
    .franja{border-bottom:1px solid #ddd;}
    .semana,.tablero{display:block;}
    .dia-semana,.col-medico{border:1px solid #999;margin-bottom:8pt;}
    /* Que en el papel se sepa de que dia y de que medico es cada bloque. */
    h4.rotulo{font-size:11pt;border-bottom:1px solid #999;padding-bottom:2pt;color:#000;
              position:static;}
    h4.rotulo small{color:#333;}
    .dia-semana .dia-num{font-size:13pt;color:#000;}
    .dia-semana .dia-nom{font-size:10pt;color:#000;}
    /* En el papel la fecha grande sigue siendo el dato que ubica la hoja, pero
       en tinta negra: un titulo celeste en una impresora laser sale gris. */
    .fecha-grande{color:#000;font-size:15pt;}
    .encabezado.dia h1{font-size:12pt;}
    /* Ni HOY ni las barras de color: en el papel no hay "hoy", hay la fecha
       que dice el titulo, y una barra de seis pixeles no sobrevive la tinta. */
    .pill.hoy,.medidor{display:none !important;}
    .completo{color:#000;}
    .pie-semana{color:#000;font-size:9pt;}
    a[href]::after{content:"";}                  /* sin URLs pegadas al texto */
    .pie-impresion{display:block !important;margin-top:10pt;padding-top:6pt;
                   border-top:1px solid #999;font-size:8.5pt;color:#444;}
  }
  .pie-impresion{display:none;}

  .oculto{display:none !important;}
  .pill{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:3px;
        border:1px solid currentColor;text-transform:uppercase;letter-spacing:.04em;}
  .pill.si{color:var(--ok);} .pill.no{color:var(--faint);}
  .pill.prop{color:var(--aviso);}

  /* ================================================================
     TAMAÑOS DE PANTALLA

     Tres lugares muy distintos: la PC del mostrador, una tablet en la mano
     de enfermería, y el teléfono de alguien que mira la agenda desde su
     casa. No hay una "versión móvil": hay una sola que se acomoda.

     Los cortes NO están en los anchos de moda de tal teléfono, sino donde
     ESTE contenido se rompe:
       700 px  la etiqueta de estado ya no entra al lado del nombre
       560 px  el logo y la marca compiten con el menú
     ================================================================ */
  @media (max-width:700px){
    /* La etiqueta de estado baja debajo del nombre en vez de apretarlo.
       Antes, "Consulta por patología · 2266 41-7730" se partía en cuatro
       renglones para dejarle lugar a la palabra RESERVADO. */
    .franja{grid-template-columns:6px 66px 1fr;
            grid-template-areas:"c h q" "c . e";row-gap:5px;}
    .franja.libre{grid-template-areas:"c h q";}
    .franja .estado{justify-self:start;}
    .franja .h{font-size:21px;}
  }
  @media (max-width:620px){
    /* En el teléfono la barra se apila: cada control ocupa el ancho completo
       en lugar de quedar apretado contra los otros. */
    .barra{gap:8px;}
    .barra > select,.barra > input[type=date]{flex:1 1 100%;}
    .barra .nav-fechas{flex:1 1 auto;}
    .barra .nav-fechas .btn{flex:1;}
    .sello{margin-left:0;flex:1 1 100%;}
    .semana,.tablero{grid-template-columns:1fr;}
    main{padding:12px;}
  }
  @media (max-width:560px){
    /* -----------------------------------------------------------------
       La cabecera en un teléfono: tres renglones, y en ESTE orden.

         1. qué es esto  (logo y marca)
         2. a dónde voy  (el menú, que es lo que más se toca)
         3. quién soy    (usuario, versión y sesión, al final)

       Antes quedaba la navegación abajo de los botones de sesión, que se
       usan una vez por día.
       ----------------------------------------------------------------- */
    header{padding:9px 10px;gap:9px 10px;}
    .marca{font-size:16.5px;gap:10px;order:1;width:100%;}
    .marca .logo{width:38px;height:38px;}
    .marca small{font-size:10px;margin-top:3px;}
    nav.menu{order:2;width:100%;margin-left:0;gap:4px;
             overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;
             /* La sombrita del borde avisa que hay más para deslizar: sin
                eso, "Configuración" cortada parece un error de dibujo. */
             -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent);
             mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent);}
    nav.menu button{white-space:nowrap;padding:7px 11px;}
    .yo{order:3;width:100%;margin-left:0;gap:8px;flex-wrap:wrap;
        padding-top:8px;border-top:1px solid var(--rule);}
    .quien-soy{margin-right:auto;font-size:12.5px;padding:4px 10px 4px 5px;}
    .franja{grid-template-columns:5px 58px 1fr;}
    .franja .h{font-size:19px;}
  }
  @media (max-width:380px){
    .franja{grid-template-columns:5px 52px 1fr;gap:0 9px;}
    .franja .h{font-size:18px;}
    .franja .quien b{font-size:14px;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
</style>

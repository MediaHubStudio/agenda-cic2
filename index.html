      '<div class="fila">' +
        '<div class="campo"><label for="p-apellido">Apellido</label>' +
          '<input type="text" id="p-apellido" style="width:100%" value="' +
          txt(soloNumeros ? '' : textoInicial) + '"></div>' +
        '<div class="campo"><label for="p-nombre">Nombre</label>' +
          '<input type="text" id="p-nombre" style="width:100%"></div>' +
      '</div>' +
      '<div class="fila">' +
        '<div class="campo"><label for="p-tipodoc">Tipo</label>' +
          '<select id="p-tipodoc" style="width:100%">' +
            '<option>DNI</option><option>LC</option><option>LE</option>' +
            '<option>CI</option><option>PAS</option><option>OTRO</option>' +
          '</select></div>' +
        '<div class="campo"><label for="p-doc">Número de documento</label>' +
          // inputmode numeric levanta el teclado numérico en una tablet, y
          // solo-dígitos se fuerza al tipear (ver abajo): en el mostrador se
          // escribe 30.111.222 por costumbre, y ese punto rompe la unicidad.
          '<input type="text" id="p-doc" inputmode="numeric" autocomplete="off" ' +
          'maxlength="11" placeholder="sin puntos" style="width:100%" value="' +
          txt(soloNumeros ? textoInicial : '') + '"></div>' +
        '<div class="campo"><label for="p-nac">Fecha de nacimiento</label>' +
          '<input type="date" id="p-nac" style="width:100%"></div>' +
      '</div>' +
      '<div class="fila">' +
        '<div class="campo"><label for="p-sexo">Sexo</label>' +
          '<select id="p-sexo" style="width:100%">' +
            '<option value="">—</option>' +
            '<option value="Femenino">Femenino</option>' +
            '<option value="Masculino">Masculino</option>' +
            '<option value="Sin especificar">Sin especificar</option>' +
          '</select></div>' +
        '<div class="campo"><label for="p-tel">Teléfono</label>' +
          '<input type="tel" id="p-tel" style="width:100%"></div>' +
        '<div class="campo"><label for="p-tel2">Otro teléfono ' +
          '<span style="color:var(--faint)">(opcional)</span></label>' +
          '<input type="tel" id="p-tel2" style="width:100%"></div>' +
      '</div>' +
      '<div class="fila">' +
        '<div class="campo"><label for="p-obra">Obra social</label>' +
          '<input type="text" id="p-obra" style="width:100%" ' +
          'placeholder="IOMA, PAMI, ninguna…"></div>' +
        '<div class="campo" style="flex:2 1 300px"><label for="p-dom">Domicilio</label>' +
          '<input type="text" id="p-dom" style="width:100%" ' +
          'placeholder="Calle 20 1234, Balcarce">' +
          '<div class="ayuda">Después se puede abrir en Google Maps desde la ficha.</div>' +
        '</div>' +
      '</div>' +

        '<span style="color:var(--faint)">(opcional)</span></label>' +

        '<div class="ayuda">Datos de contacto o de gestión. No es información clínica: ' +
        'este sistema no es una historia clínica.</div></div>' +
      '<div id="p-coincidencias"></div>',
    textoAceptar: 'Cargar paciente',
    alAceptar: function () {
      var datos = {
        idem: idem,
        apellido: valorModal('p-apellido'), nombre: valorModal('p-nombre'),
        tipo_documento: valorModal('p-tipodoc'), nro_documento: valorModal('p-doc'),
        fecha_nacimiento: valorModal('p-nac'), sexo: valorModal('p-sexo'),
        telefono: valorModal('p-tel'), telefono_alt: valorModal('p-tel2'),
        obra_social: valorModal('p-obra'), domicilio: valorModal('p-dom'),
        observaciones_adm: valorModal('p-obs')
      };
      if (!datos.apellido || !datos.nombre) {
        throw { codigo: 'CAMPOS_FALTANTES', mensaje: 'Hacen falta el apellido y el nombre.' };
      }
      return crearPacienteConAviso(datos, alCrear);

/**
 * Deja que en un campo entren únicamente dígitos.
 *
 * Se limpia al tipear y al pegar. El servidor lo comprueba igual —la pantalla
 * nunca es la garantía— pero rechazar un documento DESPUÉS de que la persona
 * completó toda la ficha es una forma pésima de enseñarle la regla.
 */
function soloNumerosEn(id) {
  var el = $(id);
  if (!el) return;
  el.addEventListener('input', function () {
    var limpio = this.value.replace(/\D/g, '');
    if (limpio !== this.value) {
      var pos = this.selectionStart - (this.value.length - limpio.length);
      this.value = limpio;
      try { this.setSelectionRange(pos, pos); } catch (e) {}
    }
  });
}

/** Pregunta por coincidencias y, si las hay, las muestra antes de crear. */
function crearPacienteConAviso(datos, alCrear) {
  return llamar('paciente.coincidencias', {
    apellido: datos.apellido, nombre: datos.nombre,
    nro_documento: datos.nro_documento, fecha_nacimiento: datos.fecha_nacimiento
  }).then(function (c) {
    if (!c.hay) return crearPaciente(datos, alCrear);

    $('p-coincidencias').innerHTML =
      '<div class="caja aviso"><h3>Ya hay pacientes parecidos</h3>' +
      '<p>Si es alguno de estos, elegilo en lugar de crear uno nuevo.</p>' +
      '<div class="tabla-cont"><table><tbody>' +
      c.coincidencias.map(function (p) {
        return '<tr><td><b>' + txt(nombrePaciente(p)) + '</b></td>' +
          '<td class="num">' + txt(p.documento) + '</td>' +
          '<td class="acciones"><button class="btn chico principal" ' +
            'data-pac="' + txt(p.id) + '">Es este</button></td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<p><button class="btn chico" id="p-igual">No es ninguno, crear uno nuevo</button></p>' +
      '</div>';

    $$('#p-coincidencias button[data-pac]').forEach(function (b) {
      b.addEventListener('click', function () {
        var p = c.coincidencias.filter(function (x) { return x.id === b.dataset.pac; })[0];
        cerrarModal();
        alElegirDesdeAlta(p, alCrear);
      });
    });
    $('p-igual').addEventListener('click', function () {
      // crearPaciente ya cierra este diálogo y devuelve el control a quien
      // llamó: cerrarlo otra vez acá cerraría el diálogo nuevo.
      crearPaciente(datos, alCrear).catch(function (err) {
        mostrarError(err, $('modal-error'));
      });
    });
    return false;                      // el diálogo queda abierto
  });
}

function crearPaciente(datos, alCrear) {
  return llamar('paciente.crear', datos).then(function (r) {
    avisar('Paciente dado de alta');
    alElegirDesdeAlta(r.paciente, alCrear);
    // Se devuelve false a propósito: este diálogo YA se cerró y en su lugar se
    // abrió el del turno con el paciente adentro. Sin esto, abrirModal cerraba
    // "el diálogo actual" al terminar y lo que cerraba era el nuevo, dejando a
    // la persona de vuelta en la agenda sin el turno que estaba dando.
    return false;
  });
}

function alElegirDesdeAlta(p, alCrear) {
  cerrarModal();
  alCrear(p);
}

// ================================================== dar un turno

/**
 * @param franja       la franja libre donde se hizo clic
 * @param pacientePre  paciente ya elegido, cuando se vuelve del alta
 */
function darTurno(franja, medicoId, fecha, pacientePre) {
  T.paciente = null;
  var idem = nuevaIdem();
  var esSobre = !!franja.sobreturno;

  abrirModal({
    titulo: (esSobre ? 'Sobreturno · ' : 'Dar turno · ') + fechaLarga(fecha) + ' ' + franja.hora,
    ancho: 680,
    cuerpo:
      '<div id="t-elegido"></div>' +
      '<div id="t-buscador"></div>' +
      '<div id="t-datos" class="oculto">' +
        '<div class="fila">' +
          '<div class="campo"><label for="t-tipo">Tipo de consulta</label>' +
            '<select id="t-tipo" style="width:100%">' +
              opciones(tiposConsulta(), null, null, 'Elegir…') +
            '</select></div>' +
          (esSobre
            ? '<div class="campo"><label for="t-motivo">Motivo del sobreturno</label>' +
              '<input type="text" id="t-motivo" style="width:100%" ' +
              'placeholder="Por qué se agrega fuera de agenda"></div>'
            : '') +
        '</div>' +
        '<div class="campo"><label for="t-obs">Observaciones ' +
          '<span style="color:var(--faint)">(opcional)</span></label>' +
          '<input type="text" id="t-obs" style="width:100%">' +
          '<div class="ayuda">Para la gestión del turno. No es información clínica.</div>' +
        '</div>' +
      '</div>',
    textoAceptar: esSobre ? 'Cargar sobreturno' : 'Dar el turno',
    alAceptar: function () {
      if (!T.paciente) {
        throw { codigo: 'FALTA_PACIENTE', mensaje: 'Elegí primero al paciente.' };
      }
      var tipo = valorModal('t-tipo');
      if (!tipo) throw { codigo: 'FALTA_TIPO', mensaje: 'Elegí el tipo de consulta.' };

      var datos = {
        idem: idem, medico_id: medicoId, fecha: fecha, inicio: franja.inicio,
        paciente_id: T.paciente.id, tipo_consulta_id: tipo,
        observaciones: valorModal('t-obs')
      };
      if (esSobre) {
        datos.motivo_sobreturno = valorModal('t-motivo');
        if (!datos.motivo_sobreturno) {
          throw { codigo: 'FALTA_MOTIVO',
                  mensaje: 'El motivo del sobreturno es obligatorio: es lo que después ' +
                           'explica por qué ese día tuvo más turnos que los configurados.' };
        }
      }

      // Acá SÍ se espera: ver la nota del encabezado del archivo.
      return llamar(esSobre ? 'turno.sobreturno' : 'turno.crear', datos).then(function (r) {
        avisar('Turno ' + r.turno.nro_turno + ' · ' + nombrePaciente(T.paciente) +
               ' · ' + fechaCorta(fecha) + ' ' + r.turno.hora);
        refrescarDespuesDe(fecha, medicoId);
      });
    }
  });

  montarBuscador('t-buscador', elegirPaciente, function (p) {
    // El alta cerró este diálogo. Se vuelve a abrir con el paciente ya
    // elegido, en lugar de dejar a la persona de vuelta en la agenda sin
    // entender qué pasó con el turno que estaba dando.
    darTurno(franja, medicoId, fecha, p);
  });
  if (pacientePre) elegirPaciente(pacientePre);

  function elegirPaciente(p) {
    T.paciente = p;
    $('t-buscador').classList.add('oculto');
    $('t-datos').classList.remove('oculto');
    $('t-elegido').innerHTML =
      '<div class="caja"><h3>' + txt(nombrePaciente(p)) + '</h3>' +
      '<p>' + txt(p.documento) +
      (p.edad !== null && p.edad !== undefined ? ' · ' + p.edad + ' años' : '') + ' ' +
      '<button class="btn chico" id="t-otro">Cambiar</button></p></div>';
    $('t-otro').addEventListener('click', function () {
      T.paciente = null;
      $('t-elegido').innerHTML = '';
      $('t-datos').classList.add('oculto');
      $('t-buscador').classList.remove('oculto');
      montarBuscador('t-buscador', elegirPaciente, function (nuevo) {
        darTurno(franja, medicoId, fecha, nuevo);
      });
    });
    var sel = $('t-tipo');
    if (sel && !sel.value && tiposConsulta().length === 1) sel.value = tiposConsulta()[0].id;
  }
}

// ================================================== turno ya dado

function verTurno(turno, medicoId, fecha) {
  var p = turno.paciente;
  var tipo = nombreDe(tiposConsulta(), turno.tipo_consulta_id);
  var puedeEstado = alcance('turno.estado').length > 0;

  var cuerpo =
    '<div class="caja"><h3>' + txt(p ? nombrePaciente(p) : 'Paciente no encontrado') + '</h3>' +
    '<p>' + txt([
        turno.hora,
        p && p.documento ? p.documento : '',
        p && p.telefono ? 'Tel. ' + p.telefono : '',
        tipo,
        turno.es_sobreturno ? 'SOBRETURNO: ' + (turno.motivo_sobreturno || 'sin motivo') : ''
      ].filter(function (x) { return x; }).join(' · ')) + '</p>' +
    '<p>Turno <b>' + txt(turno.nro_turno) + '</b> · estado ' +
      '<span class="estado e-' + txt(turno.estado) + '">' + txt(turno.estado) + '</span></p>' +
    (turno.observaciones ? '<p>' + txt(turno.observaciones) + '</p>' : '') +
    '</div>';

  var botones = [];
  if (puedeEstado && turno.estado === 'RESERVADO') {
    botones.push(['t-atendido', 'Marcar atendido', 'principal']);
    botones.push(['t-ausente', 'Marcar ausente', '']);
  }
  if (puedeEstado && turno.estado === 'AUSENTE') {
    botones.push(['t-atendido', 'Vino: marcar atendido', 'principal']);
  }
  if (alcance('turno.reprogramar').length > 0 && turno.estado === 'RESERVADO') {
    botones.push(['t-reprogramar', 'Reprogramar', '']);
  }
  if (alcance('turno.cancelar').length > 0 && turno.estado === 'RESERVADO') {
    botones.push(['t-cancelar', 'Cancelar el turno', 'peligro']);
  }

  cuerpo += botones.length
    ? '<p>' + botones.map(function (b) {
        return '<button class="btn ' + b[2] + '" id="' + b[0] + '" ' +
               'style="margin-right:6px">' + txt(b[1]) + '</button>';
      }).join('') + '</p>'
    : '<p class="ayuda">Este turno ya no admite cambios.</p>';

  abrirModal({ titulo: 'Turno del ' + fechaLarga(fecha), ancho: 620, cuerpo: cuerpo });

  if ($('t-atendido')) $('t-atendido').addEventListener('click', function () {
    cambiarEstado(turno, fecha, medicoId, 'ATENDIDO');
  });
  if ($('t-ausente')) $('t-ausente').addEventListener('click', function () {
    cambiarEstado(turno, fecha, medicoId, 'AUSENTE');
  });
  if ($('t-cancelar')) $('t-cancelar').addEventListener('click', function () {
    cerrarModal(); formCancelar(turno, fecha, medicoId);
  });
  if ($('t-reprogramar')) $('t-reprogramar').addEventListener('click', function () {
    cerrarModal(); formReprogramar(turno, fecha, medicoId);
  });
}

/**
 * Marcar atendido o ausente sí es inmediato: es lo que más se usa durante la
 * jornada, se corrige solo cambiándolo de nuevo, y no se le promete nada a
 * nadie. Si el servidor lo rechaza, el estado vuelve y el aviso es fuerte.
 */
function cambiarEstado(turno, fecha, medicoId, nuevo) {
  cerrarModal();
  var clave = claveAgenda(medicoId, fecha);

  function repintarSiCorresponde(g) {
    if (S.vista === 'agenda' && A.fecha === fecha && A.medicoId === medicoId) {
      pintarAgenda(g, false);
    }
  }

  guardarSinEsperar({
    accion: 'turno.estado',
    datos: { idem: nuevaIdem(), turno_id: turno.id, fecha: fecha, estado: nuevo },
    ok: 'Turno marcado como ' + nuevo.toLowerCase(),
    aplicar: function () {
      var g = A.grillas[clave];
      if (!g) return null;                       // nada que adelantar
      var antes = JSON.parse(JSON.stringify(g));
      marcarEnGrilla(g, turno.id, nuevo);
      repintarSiCorresponde(g);
      return function () {                       // deshacer
        A.grillas[clave] = antes;
        repintarSiCorresponde(antes);
      };
    },
    alConfirmar: function () { refrescarDespuesDe(fecha, medicoId); }
  });
}

function marcarEnGrilla(g, turnoId, estado) {
  g.franjas.forEach(function (f) {
    if (f.turno && f.turno.id === turnoId) f.turno.estado = estado;
  });
  g.sobreturnos.forEach(function (s) { if (s.id === turnoId) s.estado = estado; });
}

function formCancelar(turno, fecha, medicoId) {
  var idem = nuevaIdem();
  abrirModal({
    titulo: 'Cancelar el turno',
    cuerpo:
      '<div class="caja aviso"><p>El turno de <b>' +
        txt(turno.paciente ? nombrePaciente(turno.paciente) : 'este paciente') +
        '</b> del ' + txt(fechaCorta(fecha) + ' a las ' + turno.hora) +
        ' va a quedar cancelado y la franja se libera.</p>' +
        '<p>No se borra nada: queda registrado quién lo canceló y por qué.</p></div>' +
      '<div class="campo"><label for="c-motivo">Motivo</label>' +
        '<input type="text" id="c-motivo" style="width:100%" ' +
        'placeholder="Lo pidió el paciente, el profesional no atiende…"></div>',
    textoAceptar: 'Cancelar el turno',
    alAceptar: function () {
      var motivo = valorModal('c-motivo');
      if (!motivo) throw { codigo: 'FALTA_MOTIVO', mensaje: 'El motivo es obligatorio.' };
      return llamar('turno.cancelar',
                    { idem: idem, turno_id: turno.id, fecha: fecha, motivo: motivo })
        .then(function () {
          avisar('Turno cancelado');
          refrescarDespuesDe(fecha, medicoId);
        });
    }
  });
}

/**
 * Reprogramar: elegir el día nuevo y una franja libre de ese día.
 *
 * Las franjas del día destino se piden al servidor. Podrían salir de lo que
 * ya está en el navegador, pero acá se está por comprometer un horario con
 * una persona: conviene mirar el estado real. Igual el servidor revalida
 * dentro del candado — esto es para no ofrecer un horario ya ocupado.
 */
function formReprogramar(turno, fechaOrigen, medicoId) {
  var idem = nuevaIdem();
  var destino = fechaOrigen;

  abrirModal({
    titulo: 'Reprogramar el turno',
    ancho: 620,
    cuerpo:
      '<div class="caja"><p><b>' +
        txt(turno.paciente ? nombrePaciente(turno.paciente) : 'Paciente') + '</b> · hoy ' +
        txt(fechaCorta(fechaOrigen) + ' a las ' + turno.hora) + '</p>' +
        '<p>El turno original queda como <b>REPROGRAMADO</b>, no se borra.</p></div>' +
      '<div class="campo"><label for="r-fecha">Nueva fecha</label>' +
        '<input type="date" id="r-fecha" style="width:100%" value="' + txt(destino) + '"></div>' +
      '<div id="r-franjas"></div>',
    textoAceptar: null
  });

  $('r-fecha').addEventListener('change', function () {
    destino = this.value;
    cargarFranjas();
  });
  cargarFranjas();

  function cargarFranjas() {
    $('r-franjas').innerHTML = '<div class="cargando">Buscando horarios libres…</div>';
    llamar('agenda.dia', { medico_id: medicoId, fecha: destino })
      .then(function (g) {
        if (!$('r-franjas')) return;
        var libres = g.franjas.filter(function (f) { return f.libre; });
        if (!libres.length) {
          $('r-franjas').innerHTML =
            '<div class="vacio-msg">No hay horarios libres ese día.</div>';
          return;
        }
        $('r-franjas').innerHTML =
          '<div class="campo"><label>Horario</label><div>' +
          libres.map(function (f) {
            return '<button class="btn chico" data-ini="' + txt(f.inicio) + '" ' +
                   'style="margin:2px">' + txt(f.hora) + '</button>';
          }).join('') + '</div></div>';

        $$('#r-franjas button[data-ini]').forEach(function (b) {
          b.addEventListener('click', function () {
            confirmar(b.dataset.ini, b.textContent);
          });
        });
      })
      .catch(function (err) { if ($('r-franjas')) mostrarError(err, $('r-franjas')); });
  }

  function confirmar(inicio, hora) {
    $$('#r-franjas button').forEach(function (b) { b.disabled = true; });
    $('r-franjas').insertAdjacentHTML('beforeend',
      '<div class="cargando">Reprogramando a ' + txt(fechaCorta(destino) + ' ' + hora) + '…</div>');

    llamar('turno.reprogramar', {
      idem: idem, turno_id: turno.id,
      fecha_origen: fechaOrigen, fecha: destino, inicio: inicio
    }).then(function (r) {
      cerrarModal();
      avisar('Reprogramado al ' + fechaCorta(destino) + ' ' + hora +
             ' · turno ' + r.turno_nuevo.nro_turno);
      refrescarDespuesDe(fechaOrigen, medicoId);
      if (destino !== fechaOrigen) refrescarDespuesDe(destino, medicoId);
    }).catch(function (err) {
      mostrarError(err, $('modal-error'));
      cargarFranjas();
    });
  }
}

// ================================================== sobreturno suelto

/**
 * Sobreturno desde la barra, sin partir de una franja: se elige el horario de
 * referencia entre los del día. Es el caso de la urgencia que llega y hay que
 * meter en algún lado.
 */
function nuevoSobreturno(medicoId, fecha) {
  var g = A.grillas[claveAgenda(medicoId, fecha)];
  if (!g || !g.franjas.length) {
    avisar('Ese día no tiene horario de atención configurado: no se puede colgar un ' +
           'sobreturno de ninguna franja.', 'error');
    return;
  }
  abrirModal({
    titulo: 'Sobreturno · ' + fechaLarga(fecha),
    cuerpo:
      '<div class="caja"><p>El sobreturno se cuelga de un horario de referencia, para ' +
      'que quede claro entre qué turnos se va a atender.</p></div>' +
      '<div class="campo"><label>Horario de referencia</label><div>' +
      g.franjas.map(function (f) {
        return '<button class="btn chico" data-ini="' + txt(f.inicio) + '" ' +
               'data-hora="' + txt(f.hora) + '" style="margin:2px">' + txt(f.hora) + '</button>';
      }).join('') + '</div></div>',
    textoAceptar: null
  });

  $$('.fondo-modal button[data-ini]').forEach(function (b) {
    b.addEventListener('click', function () {
      cerrarModal();
      darTurno({ inicio: b.dataset.ini, hora: b.dataset.hora, sobreturno: true }, medicoId, fecha);
    });
  });
}
</script>

<script>
// =====================================================================
//  Vista: pacientes.
//
//  ================================================================
//   ESTA PANTALLA ES LA MÁS SENSIBLE DEL SISTEMA
//
//   Todo lo demás muestra los pacientes de UNA agenda o de UN día. Acá se
//   ve el padrón: toda la gente que pasó por el centro. Por eso:
//
//   · La pestaña solo aparece con el alcance TODOS de `paciente.ver`. Ni
//     enfermería ni los profesionales la ven: ellos tienen el buscador,
//     que les muestra a quien tiene turno con ellos o en el día.
//   · El listado trae el TELÉFONO, y solo para quien ya podía verlo abriendo
//     una ficha. El domicilio y las observaciones siguen siendo de la ficha,
//     y abrir una ficha queda auditado: es la única forma de contestar
//     "¿quién miró los datos de esta persona?" ante un reclamo.
//   · No hay ningún dato clínico, y no lo va a haber. Esto es una agenda.
//  ================================================================
// =====================================================================

// tam: cuántos se ven por página. 0 = todos los que trajo el servidor.
// bloque: el tramo del padrón que ya está en el navegador, tal como llegó.
var P = { texto: '', inactivos: false, gen: 0, pagina: 1, tam: 20, bloque: null };

// Los tamaños que se pueden elegir. El 0 va último y dice "Todos".
var TAMANOS = [10, 20, 50, 100, 300, 0];

// ================================================================
//  POR QUÉ SE PIDEN 300 Y SE MUESTRAN 20
//
//  Cada viaje al servidor cuesta más de un segundo, y eso no baja por pedir
//  menos filas: el costo está en el viaje. Si cada clic en "siguiente"
//  pidiera diez fichas, pasar diez páginas serían diez esperas.
//
//  Así que se traen 300 de una y las páginas se arman en el navegador: pasar
//  de página no pide NADA hasta que se sale del tramo traído. Es la misma
//  idea que la ventana de días de la agenda.
// ================================================================
var BLOQUE_PADRON = 300;

function vigenteP(gen) { return gen === P.gen && S.vista === 'pacientes'; }

function montarPacientes(cont) {
  P.gen++;
  cont.innerHTML =
    '<div class="barra">' +
      '<input type="text" id="pac-buscar" placeholder="Buscar por apellido, nombre o documento…" ' +
        'style="flex:1 1 320px" value="' + txt(P.texto) + '" autocomplete="off">' +
      '<label class="en-linea"><input type="checkbox" id="pac-inactivos"' +
        (P.inactivos ? ' checked' : '') + '> Ver también los dados de baja</label>' +
      (puede('paciente.crear')
        ? '<button class="btn principal" id="pac-nuevo">Cargar paciente</button>' : '') +
      '<span class="sello" id="pac-cuenta"></span>' +
    '</div>' +
    '<main class="ancha"><div id="pac-avisos"></div><div id="pac-cuerpo">' +
      '<div class="cargando">Cargando…</div></div></main>';

  $('pac-buscar').addEventListener('input', function () {
    P.texto = this.value;
    // Se espera a que deje de escribir: un pedido por tecla llenaría la cola
    // y haría más lento justo lo que se quiere que sea rápido.
    if (P.reloj) clearTimeout(P.reloj);
    P.reloj = setTimeout(cargarPacientes, 350);
  });
  $('pac-inactivos').addEventListener('change', function () {
    P.inactivos = this.checked;
    cargarPacientes();
  });
  if ($('pac-nuevo')) {
    $('pac-nuevo').addEventListener('click', function () {
      formPacienteNuevo('', function (p) { cargarPacientes(); verPaciente(p.id); });
    });
  }

  cargarPacientes();
}

/** Cambió el filtro: lo que había en el navegador ya no sirve y se vuelve a
 *  la primera página. */
function cargarPacientes() {
  P.bloque = null;
  P.pagina = 1;
  irAPaginaPac(1);
}

/** Se editó una ficha: hay que volver a pedir, pero sin mover a la persona de
 *  la página en la que estaba. */
function refrescarPacientes() {
  if (S.vista !== 'pacientes') return;
  P.bloque = null;
  irAPaginaPac(P.pagina);
}

/** El primer índice del padrón que muestra una página. */
function primeroDePagina(pagina) { return P.tam ? (pagina - 1) * P.tam : 0; }

function paginasPac() {
  var b = P.bloque;
  if (!b || !P.tam) return 1;
  return Math.max(1, Math.ceil(b.total / P.tam));
}

/**
 * Muestra una página, pidiendo al servidor solo si hace falta.
 *
 * "Hace falta" es que la página caiga fuera del tramo que ya está en el
 * navegador. Mientras caiga adentro, cambiar de página es instantáneo.
 */
function irAPaginaPac(pagina) {
  // El recorte al total solo se puede hacer si ya se sabe cuántos hay. Sin
  // tramo traído todavía no se sabe, y recortar contra un total inventado
  // mandaría siempre a la página 1.
  P.pagina = Math.max(1, P.bloque ? Math.min(pagina, paginasPac()) : pagina);
  var b = P.bloque;
  var primero = primeroDePagina(P.pagina);
  var ultimo = P.tam ? (primero + P.tam - 1) : Number.MAX_VALUE;

  if (b) {
    var finBloque = b.desde + b.pacientes.length;   // primer índice que NO tiene
    var cubre = primero >= b.desde &&
                (ultimo < finBloque || finBloque >= b.total);
    if (cubre) { pintarPacientes(); return; }
  }
  // Se pide alineado al bloque para que las páginas siguientes ya estén.
  pedirBloquePac(P.tam ? Math.floor(primero / BLOQUE_PADRON) * BLOQUE_PADRON : 0);
}

function pedirBloquePac(desde) {
  var gen = P.gen;
  var cuerpo = $('pac-cuerpo');
  if (!cuerpo) return;
  cuerpo.innerHTML = '<div class="cargando">Buscando…</div>';

  llamar('pacientes.listar', {
    texto: P.texto, inactivos: P.inactivos,
    desde: desde,
    // Con "Todos" no se manda cantidad: el servidor manda lo que entra en un
    // viaje —su tope— y la pantalla avisa si quedó gente afuera.
    cantidad: P.tam ? BLOQUE_PADRON : 0
  })
    .then(function (r) {
      if (!vigenteP(gen)) return;
      P.bloque = r;
      // El servidor puede haber corrido el arranque (si se borró gente y la
      // página quedó más allá del final): la pantalla se acomoda a lo que vino.
      if (P.tam && primeroDePagina(P.pagina) < r.desde) {
        P.pagina = Math.floor(r.desde / P.tam) + 1;
      }
      pintarPacientes();
    })
    .catch(function (err) {
      if (!vigenteP(gen)) return;
      mostrarError(err, $('pac-cuerpo'), function () { pedirBloquePac(desde); });
    });
}

/** Las filas que le tocan a la página actual, recortadas del tramo traído. */
function filasDePagina() {
  var b = P.bloque;
  if (!b) return [];
  if (!P.tam) return b.pacientes;
  var i = Math.max(0, primeroDePagina(P.pagina) - b.desde);
  return b.pacientes.slice(i, i + P.tam);
}

function pintarPacientes() {
  var b = P.bloque;
  if (!b) return;
  $('pac-cuenta').textContent = b.total + ' paciente' + (b.total === 1 ? '' : 's');

  if (!b.total) {
    $('pac-cuerpo').innerHTML = P.texto
      ? '<div class="caja"><h3>Nadie con ese dato</h3>' +
        '<p>Probá con menos letras, o con el número de documento.</p></div>'
      : '<div class="caja"><h3>Todavía no hay pacientes</h3>' +
        '<p>Se cargan al dar el primer turno, o con el botón <b>Cargar paciente</b>.</p></div>';
    return;
  }

  var filas = filasDePagina();
  var html = '';

  // Con "Todos" el servidor manda hasta su tope y no más: si el padrón es más
  // grande, hay que decirlo. Con páginas esto no pasa nunca, porque se va
  // pidiendo tramo por tramo.
  if (!P.tam && b.total > b.pacientes.length) {
    html += '<div class="caja aviso"><p>Se muestran <b>' + b.pacientes.length +
      '</b> de ' + b.total + ': de un solo viaje no vienen más. Elegí una cantidad ' +
      'por página para recorrer el padrón entero, o usá el buscador de arriba, ' +
      'que busca sobre todo el padrón y no sobre esta lista.</p></div>';
  }

  // El teléfono solo llega si el rol lo permite. Si no vino en ninguna ficha,
  // la columna no se dibuja: una columna entera de guiones no informa nada.
  var hayTel = filas.some(function (p) { return p.telefono !== undefined; });

  html += barraPaginado(b, filas.length);
  html += '<div class="tabla-cont tabla-scroll"><table><thead><tr>' +
    '<th>Paciente</th><th>Documento</th><th>Edad</th>' +
    (hayTel ? '<th>Teléfono</th>' : '') +
    '<th>Obra social</th><th></th>' +
    '</tr></thead><tbody>' +
    filas.map(function (p) {
      return '<tr' + (p.activo ? '' : ' class="inactiva"') + '>' +
        '<td><b>' + txt(p.apellido + ', ' + p.nombre) + '</b>' +
          (p.activo ? '' : ' <span class="pill no">Baja</span>') + '</td>' +
        '<td class="num">' + txt(p.documento) + '</td>' +
        '<td class="num">' + (p.edad === '' ? '—' : txt(String(p.edad))) + '</td>' +
        (hayTel ? '<td class="num">' + telefonoCelda(p) + '</td>' : '') +
        '<td>' + txt(p.obra_social || '—') + '</td>' +
        '<td class="acciones"><button class="btn chico" data-pac="' + txt(p.id) +
          '">Ver ficha</button></td></tr>';
    }).join('') + '</tbody></table></div>';

  $('pac-cuerpo').innerHTML = html;
  $$('#pac-cuerpo button[data-pac]').forEach(function (b2) {
    b2.addEventListener('click', function () { verPaciente(b2.dataset.pac); });
  });
  conectarPaginado();
}

/** El teléfono de la lista, con el segundo abajo si lo hay. */
function telefonoCelda(p) {
  var uno = p.telefono || '';
  var dos = p.telefono_alt || '';
  if (!uno && !dos) return '—';
  return (uno ? enlaceTel(uno) : '') +
         (dos ? '<span class="tel-alt">' + enlaceTel(dos) + '</span>' : '');
}

/**
 * El teléfono como enlace `tel:`.
 *
 * En la computadora del mostrador no hace nada, y está bien: sigue siendo
 * texto que se lee y se copia. En un celular o una tablet —que es donde se
 * llama de verdad cuando hay que avisar que el profesional no viene— marca
 * el número con un toque.
 */
function enlaceTel(numero) {
  var limpio = String(numero).replace(/[^0-9+]/g, '');
  if (!limpio) return txt(numero);
  return '<a href="tel:' + txt(limpio) + '">' + txt(numero) + '</a>';
}

/**
 * La barra de paginado: cuántos se ven por página, en qué página se está y
 * los botones para moverse.
 */
function barraPaginado(b, enPantalla) {
  var paginas = paginasPac();
  var desde = P.tam ? primeroDePagina(P.pagina) + 1 : 1;
  var hasta = P.tam ? Math.min(desde + enPantalla - 1, b.total) : enPantalla;

  return '<div class="paginado sin-imprimir">' +
    '<label class="en-linea">Mostrar ' +
      '<select id="pac-tam" aria-label="Pacientes por página">' +
        TAMANOS.map(function (n) {
          return '<option value="' + n + '"' + (n === P.tam ? ' selected' : '') + '>' +
                 (n ? n : 'Todos') + '</option>';
        }).join('') +
      '</select></label>' +
    '<span class="rango">' + desde + '–' + hasta + ' de ' + b.total + '</span>' +
    (P.tam
      ? '<div class="nav-fechas">' +
          '<button class="btn chico" id="pac-ant"' + (P.pagina <= 1 ? ' disabled' : '') +
            ' title="Página anterior" aria-label="Página anterior">&#9664;</button>' +
          '<button class="btn chico" id="pac-pag" disabled>' +
            P.pagina + ' / ' + paginas + '</button>' +
          '<button class="btn chico" id="pac-sig"' +
            (P.pagina >= paginas ? ' disabled' : '') +
            ' title="Página siguiente" aria-label="Página siguiente">&#9654;</button>' +
        '</div>'
      : '') +
    '</div>';
}

function conectarPaginado() {
  var sel = $('pac-tam');
  if (sel) {
    sel.addEventListener('change', function () {
      // Se conserva a quién estaba mirando: si estaba en el paciente 45 y pasa
      // de 20 a 50 por página, sigue viendo esa parte del padrón y no vuelve
      // al principio.
      var primeroAntes = primeroDePagina(P.pagina);
      P.tam = Number(this.value) || 0;
      // Con "Todos" el tramo tiene que empezar en cero, y el que hay puede no.
      if (!P.tam) { P.bloque = null; P.pagina = 1; irAPaginaPac(1); return; }
      irAPaginaPac(Math.floor(primeroAntes / P.tam) + 1);
    });
  }
  if ($('pac-ant')) $('pac-ant').addEventListener('click', function () { irAPaginaPac(P.pagina - 1); });
  if ($('pac-sig')) $('pac-sig').addEventListener('click', function () { irAPaginaPac(P.pagina + 1); });
}

// ---------------------------------------------------------------- la ficha

function verPaciente(id) {
  avisar('Abriendo la ficha…');
  llamar('paciente.ver', { paciente_id: id })
    .then(function (r) { pintarFicha(r.paciente); })
    .catch(function (err) { mostrarError(err, null); });
}

/**
 * La ficha del paciente.
 *
 * ================================================================
 *  QUÉ SE MIRA ACÁ, Y EN QUÉ ORDEN
 *
 *  Esta ventana se abre casi siempre con el teléfono en la mano o con la
 *  persona parada enfrente. Lo que se busca es, por ese orden: quién es
 *  (para confirmar que es la persona correcta), cómo contactarla, y cuándo
 *  vino o cuándo viene.
 *
 *  Por eso ya no es una lista de once renglones iguales donde el documento y
 *  el correo pesan lo mismo. Arriba va la identidad —documento, edad, obra
 *  social— en fichas grandes que se leen de un vistazo; después el contacto,
 *  con los teléfonos como enlaces para llamar; y al final los turnos.
 *
 *  Un dato que no está se dice una sola vez y en gris. Lo que NO hay acá es
 *  cualquier cosa clínica, y no la va a haber: esto es una agenda.
 * ================================================================
 */
function pintarFicha(p) {
  var html = '';

  if (!p.activo) {
    html += '<div class="caja aviso"><h3>Paciente dado de baja</h3>' +
      '<p>No aparece en las búsquedas ni se le pueden dar turnos nuevos. ' +
      'Sus turnos anteriores siguen en el sistema.</p></div>';
  }

  // ---- identidad: lo que confirma que es la persona correcta ----
  html += '<div class="ficha-datos">' +
    tarjetaDato('Documento', p.documento, 'grande') +
    tarjetaDato('Edad', p.edad === '' ? '' : p.edad + ' años',
                '', p.fecha_nacimiento ? 'Nació el ' + fechaCorta(p.fecha_nacimiento) : '') +
    tarjetaDato('Sexo', p.sexo) +
    tarjetaDato('Obra social', p.obra_social) +
    '</div>';

  // ---- contacto: para lo que de verdad se abre esta ventana ----
  var tel = (p.telefono ? enlaceTel(p.telefono) : '') +
            (p.telefono_alt ? '<span class="tel-alt">' + enlaceTel(p.telefono_alt) + '</span>' : '');
  html += '<h2 class="titulo-bloque">Contacto</h2>' +
    '<div class="ficha-datos">' +
      tarjetaDato('Teléfono', tel, 'grande', '', true) +
      tarjetaDato('Correo', p.email
        ? '<a href="mailto:' + txt(p.email) + '">' + txt(p.email) + '</a>' : '', '', '', true) +
    '</div>' +
    '<div class="ficha-datos una">' +
      tarjetaDato('Domicilio', p.domicilio ? enlaceMapa(p.domicilio) : '', '', '', true) +
    '</div>';

  if (p.observaciones_adm) {
    html += '<h2 class="titulo-bloque">Observaciones administrativas</h2>' +
            '<div class="caja"><p>' + txt(p.observaciones_adm) + '</p>' +
            '<p class="ayuda">No es información clínica: este sistema no es una ' +
            'historia clínica.</p></div>';
  }

  // ---- turnos ----
  if (p.ultimos_turnos && p.ultimos_turnos.length) {
    html += '<h2 class="titulo-bloque">Últimos turnos</h2>' +
      '<div class="tabla-cont"><table><thead><tr><th>Fecha</th><th>Hora</th>' +
      '<th>Profesional</th><th>Estado</th></tr></thead><tbody>' +
      p.ultimos_turnos.map(function (t) {
        return '<tr class="' + (t.estado ? 'est-' + txt(t.estado) : '') + '">' +
          '<td class="num">' + txt(fechaCorta(t.fecha)) + '</td>' +
          '<td class="num">' + (t.es_sobreturno ? '+' : '') + txt(t.hora) + '</td>' +
          '<td>' + txt(nombreMedico(t.medico_id)) + '</td>' +
          '<td>' + insignia(t.estado) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  } else if (p.ultimos_turnos) {
    html += '<h2 class="titulo-bloque">Últimos turnos</h2>' +
            '<p class="ayuda">Sin turnos registrados.</p>';
  }

  abrirModal({
    titulo: nombrePaciente(p),
    ancho: 680,
    cuerpo: html,
    textoAceptar: puede('paciente.editar') ? 'Editar' : null,
    alAceptar: puede('paciente.editar') ? function () { formPacienteEditar(p); return false; } : null
  });
}

/**
 * Un dato de la ficha, con su rótulo arriba en chico y el valor abajo.
 *
 * @param crudo true si el valor ya es HTML armado acá (un enlace). Todo lo
 *              demás se escapa: un apellido con un < no puede romper nada.
 */
function tarjetaDato(rotulo, valor, clase, pie, crudo) {
  var vacio = (valor === null || valor === undefined || valor === '');
  return '<div class="dato-tarjeta' + (clase ? ' ' + clase : '') + '">' +
    '<span class="rot">' + txt(rotulo) + '</span>' +
    '<span class="val' + (vacio ? ' vacio' : '') + '">' +
      (vacio ? 'Sin dato' : (crudo ? valor : txt(String(valor)))) + '</span>' +
    (pie && !vacio ? '<span class="pie">' + txt(pie) + '</span>' : '') +
    '</div>';
}

/**
 * El domicilio, como enlace a Google Maps.
 *
 * Se le agrega "Balcarce, Buenos Aires, Argentina": sin eso, "Calle 20 1234"
 * cae en cualquier ciudad del país y el enlace es peor que no tenerlo.
 *
 * Va como BÚSQUEDA, no como coordenada: nadie carga el domicilio con
 * precisión de GPS, y una búsqueda tolera "20 e/ 15 y 17" o un barrio suelto,
 * que es como se anotan las direcciones de verdad en un mostrador.
 */
function enlaceMapa(domicilio) {
  if (!domicilio) return '—';
  var consulta = encodeURIComponent(domicilio + ', Balcarce, Buenos Aires, Argentina');
  return '<a href="https://www.google.com/maps/search/?api=1&query=' + consulta + '" ' +
         'target="_blank" rel="noopener">' + txt(domicilio) + '</a>' +
         '<span class="ayuda">Abre en Google Maps, en una pestaña nueva.</span>';
}

// ---------------------------------------------------------------- editar

function formPacienteEditar(p) {
  var idem = nuevaIdem();
  function opcionSexo(v) {
    return '<option value="' + txt(v) + '"' +
           (String(p.sexo) === v ? ' selected' : '') + '>' + txt(v) + '</option>';
  }

  abrirModal({
    titulo: 'Editar ' + nombrePaciente(p),
    ancho: 620,
    cuerpo:
      '<div class="fila">' +
        '<div class="campo"><label for="e-apellido">Apellido</label>' +
          '<input type="text" id="e-apellido" style="width:100%" value="' +
          txt(p.apellido) + '"></div>' +
        '<div class="campo"><label for="e-nombre">Nombre</label>' +
          '<input type="text" id="e-nombre" style="width:100%" value="' +
          txt(p.nombre) + '"></div>' +
      '</div>' +
      '<div class="fila">' +
        '<div class="campo"><label for="e-doc">Número de documento</label>' +
          '<input type="text" id="e-doc" inputmode="numeric" maxlength="11" ' +
          'placeholder="sin puntos" style="width:100%" value="' +
          txt(p.nro_documento || '') + '"></div>' +
        '<div class="campo"><label for="e-nac">Fecha de nacimiento</label>' +
          '<input type="date" id="e-nac" style="width:100%" value="' +
          txt(String(p.fecha_nacimiento || '').substring(0, 10)) + '"></div>' +
        '<div class="campo"><label for="e-sexo">Sexo</label>' +
          '<select id="e-sexo" style="width:100%">' +
            '<option value="">—</option>' + opcionSexo('Femenino') +
            opcionSexo('Masculino') + opcionSexo('Sin especificar') +
          '</select></div>' +
      '</div>' +
      '<div class="fila">' +
        '<div class="campo"><label for="e-tel">Teléfono</label>' +
          '<input type="tel" id="e-tel" style="width:100%" value="' +
          txt(p.telefono || '') + '"></div>' +
        '<div class="campo"><label for="e-tel2">Otro teléfono</label>' +
          '<input type="tel" id="e-tel2" style="width:100%" value="' +
          txt(p.telefono_alt || '') + '"></div>' +
        '<div class="campo"><label for="e-obra">Obra social</label>' +
          '<input type="text" id="e-obra" style="width:100%" value="' +
          txt(p.obra_social || '') + '"></div>' +
      '</div>' +
      '<div class="campo"><label for="e-dom">Domicilio</label>' +
        '<input type="text" id="e-dom" style="width:100%" value="' +
        txt(p.domicilio || '') + '"></div>' +
      '<div class="campo"><label for="e-obs">Observaciones administrativas</label>' +
        '<input type="text" id="e-obs" style="width:100%" value="' +
        txt(p.observaciones_adm || '') + '">' +
        '<div class="ayuda">No es información clínica: este sistema no es una ' +
        'historia clínica.</div></div>' +
      (puede('paciente.baja')
        ? '<div class="campo"><label><input type="checkbox" id="e-activo"' +
          (p.activo ? ' checked' : '') + '> Paciente activo</label>' +
          '<div class="ayuda">Desmarcado, deja de aparecer en las búsquedas. ' +
          'No se borra nada y sus turnos quedan.</div></div>'
        : ''),
    textoAceptar: 'Guardar',
    alAceptar: function () {
      var datos = {
        idem: idem, paciente_id: p.id, version: p.version,
        apellido: valorModal('e-apellido'), nombre: valorModal('e-nombre'),
        nro_documento: valorModal('e-doc'), fecha_nacimiento: valorModal('e-nac'),
        sexo: valorModal('e-sexo'),
        telefono: valorModal('e-tel'), telefono_alt: valorModal('e-tel2'),
        obra_social: valorModal('e-obra'), domicilio: valorModal('e-dom'),
        observaciones_adm: valorModal('e-obs')
      };
      if (puede('paciente.baja')) datos.activo = valorModal('e-activo');
      if (!datos.apellido || !datos.nombre) {
        throw { codigo: 'CAMPOS_FALTANTES', mensaje: 'Hacen falta el apellido y el nombre.' };
      }
      return llamar('paciente.editar', datos).then(function () {
        avisar('Ficha actualizada');
        refrescarPacientes();
      });
    }
  });
  soloNumerosEn('e-doc');
}
</script>

<script>
// =====================================================================
//  Vista: configuracion.
//  Catalogos, medicos, horarios de atencion, y usuarios con sus roles.
// =====================================================================

// gen sube cada vez que se cambia de pestaña. Una respuesta que llega
// cuando la persona ya se fue a otra pestaña se descarta: sin esto, el
// pedido de la pestaña vieja pintaba —o mostraba su error— encima de la
// nueva. Ese era el cartelito de error que aparecía y se iba solo.
var C = { seccion: null, medicoId: null, catalogoActual: null, gen: 0 };

/** ¿La respuesta que acaba de llegar sigue siendo la que se está mirando? */
function vigente(gen) { return gen === C.gen && S.vista === 'config'; }

var SECCIONES_CONFIG = [
  { id:'medicos',       etiqueta:'Profesionales',      permiso:'config.catalogos', pintar:pintarMedicos },
  { id:'horarios',      etiqueta:'Horarios',     permiso:'config.plantillas',pintar:pintarHorarios },
  { id:'especialidades',etiqueta:'Especialidades',permiso:'config.catalogos',pintar:function(c){pintarCatalogo(c,'ESPECIALIDADES');} },
  { id:'consultorios',  etiqueta:'Consultorios', permiso:'config.catalogos', pintar:function(c){pintarCatalogo(c,'CONSULTORIOS');} },
  { id:'tipos',         etiqueta:'Tipos de consulta',permiso:'config.catalogos',pintar:function(c){pintarCatalogo(c,'TIPOS_CONSULTA');} },
  { id:'usuarios',      etiqueta:'Usuarios y roles',permiso:'config.usuarios',pintar:pintarUsuarios },
  { id:'feriados',      etiqueta:'Feriados',       permiso:'config.catalogos',pintar:pintarFeriados },
  { id:'velocidad',     etiqueta:'Velocidad',      permiso:'config.sistema',  pintar:pintarVelocidad }
];

function montarConfig(cont) {
  var disponibles = SECCIONES_CONFIG.filter(function (s) { return puede(s.permiso); });
  if (!disponibles.length) {
    cont.innerHTML = '<main><div class="caja error"><h3>Sin permisos</h3></div></main>';
    return;
  }
  if (!C.seccion || !disponibles.some(function (s) { return s.id === C.seccion; })) {
    C.seccion = disponibles[0].id;
  }

  C.gen++;

  cont.innerHTML =
    '<div class="barra">' +
      '<nav class="menu" style="margin-left:0" aria-label="Configuración">' +
        disponibles.map(function (s) {
          return '<button data-sec="' + s.id + '"' +
                 (s.id === C.seccion ? ' aria-current="page"' : '') + '>' +
                 txt(s.etiqueta) + '</button>';
        }).join('') +
      '</nav>' +
    '</div>' +
    '<main><div id="cfg-avisos"></div><div id="cfg-cuerpo">' +
      '<div class="cargando">Cargando…</div></div></main>';

  $$('#vista .barra button').forEach(function (b) {
    b.addEventListener('click', function () { C.seccion = this.dataset.sec; montarConfig(cont); });
  });

  var sec = disponibles.filter(function (s) { return s.id === C.seccion; })[0];
  sec.pintar($('cfg-cuerpo'));
}

function recargarConfig() {
  montarConfig($('vista'));
}

/**
 * Aplica un cambio a la lista que ya está en memoria y repinta al instante.
 * Devuelve la forma de volver atrás, para cuando el servidor rechaza.
 *
 * Si la lista todavía no estaba en memoria no hay nada que adelantar y se
 * devuelve null: la pantalla se dibujará cuando llegue la respuesta, como
 * antes. Nunca se inventa lo que no se sabe.
 */
function aplicarLocal(accion, clave, transformar) {
  var antes = leerCache(accion, clave);
  if (!antes) return null;
  var despues = JSON.parse(JSON.stringify(antes));
  transformar(despues);
  guardarEnCache(accion, clave, despues);
  recargarConfig();
  return function () { guardarEnCache(accion, clave, antes); recargarConfig(); };
}

/** Mete o reemplaza una fila por id dentro de una lista. */
function ponerEnLista(lista, obj) {
  for (var i = 0; i < lista.length; i++) {
    if (String(lista[i].id) === String(obj.id)) { lista[i] = obj; return; }
  }
  lista.push(obj);
}

/**
 * Trae las listas de configuración mientras la persona mira la agenda, para
 * que abrir Configuración no tenga que esperar a nadie.
 */
/**
 * Llena TODAS las solapas de Configuración con un solo pedido, mientras la
 * persona mira la agenda.
 *
 * Antes eran cinco pedidos encadenados de dos segundos y medio: si entraba a
 * Configuración antes de que terminaran —o sea, casi siempre— esperaba igual.
 */
function precargarConfig() {
  if (!puede('config.catalogos')) {
    if (puede('config.usuarios')) {
      llamarCacheado('config.usuarios.listar', {}, VIDA_CACHE_SEG, { fondo: true })
        .catch(function () {});
    }
    return;
  }
  llamar('config.todo', {}, { fondo: true })
    .then(guardarConfigCompleta)
    .catch(function () { /* comodidad: si falla, cada solapa se pide sola */ });
}

/** Reparte la respuesta única entre las claves que usa cada solapa. */
function guardarConfigCompleta(r) {
  if (!r) return;
  if (r.catalogos) S.sesion.catalogos = r.catalogos;
  if (r.medicos) guardarEnCache('config.medicos.listar', {}, { medicos: r.medicos });
  if (r.listas) {
    Object.keys(r.listas).forEach(function (cat) {
      guardarEnCache('config.catalogo.listar', { catalogo: cat },
                     { catalogo: cat, filas: r.listas[cat] });
    });
  }
  if (r.plantillas) {
    guardarEnCache('config.plantillas.listar', { medico_id: r.plantillas_de },
                   { plantillas: r.plantillas });
    if (!C.medicoId) C.medicoId = r.plantillas_de;
  }
  if (r.usuarios) {
    guardarEnCache('config.usuarios.listar', {},
                   { usuarios: r.usuarios, roles_disponibles: r.roles_disponibles });
  }
}

// ================================================================ feriados

/**
 * Los días en que el centro no abre.
 *
 * Los fijos y los que se derivan de la Pascua los siembra el sistema. Los
 * puentes turísticos NO: los fija el Poder Ejecutivo por decreto, un año a la
 * vez y sin patrón, así que se cargan a mano. Un sistema que pretendiera
 * calcularlos daría turnos en días cerrados y nadie se enteraría hasta que un
 * paciente viniera al pedo.
 */
function pintarFeriados(cont) {
  var gen = C.gen;
  cont.innerHTML = '<div class="cargando">Cargando…</div>';
  C.anioFeriados = C.anioFeriados || Number((S.sesion.hoy || hoyLocal()).substring(0, 4));

  llamarCacheado('config.feriados.listar', { anio: C.anioFeriados }).then(function (r) {
    if (!vigente(gen)) return;
    var dias = (r.dias_laborables || []).map(function (d) { return DIAS_SEMANA[d]; }).join(', ');

    var html = '<section class="bloque"><h2>Feriados ' + r.anio +
      '<span class="der">' +
        '<button class="btn chico" id="fer-ant">◀</button> ' +
        '<button class="btn chico" id="fer-sig">▶</button> ' +
        (puede('config.sistema')
          ? '<button class="btn chico" id="fer-sembrar">Traer los conocidos</button> ' +
            '<button class="btn principal chico" id="fer-nuevo">Agregar</button>'
          : '') +
      '</span></h2>' +
      '<div class="caja"><p>El centro abre <b>' + txt(dias) + '</b>. Esos días, más los ' +
      'feriados de esta lista, la agenda no ofrece ningún turno: no aparecen franjas ' +
      'libres y no se puede dar un turno desde ninguna pantalla.</p>' +
      '<p class="ayuda">Para atender un día cerrado —una campaña, un sábado puntual— se ' +
      'usa una <b>apertura extraordinaria</b>, que se aprueba aparte.</p></div>';

    // La tabla de feriados llegó después de que este sistema se instalara: en
    // una instalación vieja la hoja no existe. Antes eso era un error crudo en
    // la cara ("No existe la hoja FERIADOS"); ahora se explica y se arregla
    // con el mismo botón que ya siembra los feriados.
    if (r.falta_hoja) {
      html += '<div class="caja aviso"><h3>Falta preparar el calendario</h3>' +
        '<p>Este sistema se instaló antes de que existiera la lista de feriados, ' +
        'así que la tabla todavía no está creada. No se perdió nada: hay que ' +
        'crearla una sola vez.</p>' +
        (puede('config.sistema')
          ? '<p>Apretá <b>Traer los conocidos</b> acá arriba. Crea la tabla y carga ' +
            'los feriados nacionales de ' + r.anio + '. Después repetilo en ' +
            (r.anio + 1) + ' con ▶.</p>'
          : '<p>Pedile a un administrador que entre acá y apriete ' +
            '<b>Traer los conocidos</b>.</p>') +
        '</div>';
    }

    if (!r.falta_hoja && !r.proximo_anio_cargado) {
      html += '<div class="caja aviso"><h3>Falta cargar ' + (r.anio + 1) + '</h3>' +
        '<p>En diciembre ya se dan turnos de enero. Pasá al año que viene con ▶ y ' +
        'apretá <b>Traer los conocidos</b>.</p></div>';
    }

    if (r.falta_hoja) {
      // No se dibuja la tabla vacía: diría "no hay feriados", que no es lo
      // que pasa. Lo que pasa es que todavía no hay dónde guardarlos.
    } else if (!r.feriados.length) {
      html += '<div class="vacio-msg">No hay feriados cargados para ' + r.anio + '.</div>';
    } else {
      html += '<div class="tabla-cont"><table><thead><tr><th>Fecha</th><th>Día</th>' +
        '<th>Motivo</th><th>Origen</th><th>Estado</th><th></th></tr></thead><tbody>' +
        r.feriados.map(function (f) {
          return '<tr' + (f.activo ? '' : ' class="inactiva"') + '>' +
            '<td class="num">' + txt(fechaCorta(f.fecha)) + '</td>' +
            '<td>' + txt(DIAS_SEMANA[diaSemanaDe(f.fecha)]) + '</td>' +
            '<td><b>' + txt(f.nombre) + '</b></td>' +
            '<td>' + (f.origen === 'AUTOMATICO' ? 'Del sistema' : 'Cargado a mano') + '</td>' +
            '<td><span class="pill ' + (f.activo ? 'si' : 'no') + '">' +
              (f.activo ? 'Cerrado' : 'Anulado') + '</span></td>' +
            '<td class="acciones">' +
              (puede('config.sistema')
                ? '<button class="btn chico" data-id="' + txt(f.id) + '">Editar</button>'
                : '') +
            '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    cont.innerHTML = html + '</section>';

    $('fer-ant').addEventListener('click', function () {
      C.anioFeriados--; olvidarCache('config.feriados'); recargarConfig();
    });
    $('fer-sig').addEventListener('click', function () {
      C.anioFeriados++; olvidarCache('config.feriados'); recargarConfig();
    });
    if ($('fer-nuevo')) {
      $('fer-nuevo').addEventListener('click', function () { formFeriado(null); });
    }
    if ($('fer-sembrar')) {
      $('fer-sembrar').addEventListener('click', function () {
        guardarSinEsperar({
          accion: 'config.feriados.sembrar',
          datos: { idem: nuevaIdem(), anio: C.anioFeriados },
          ok: 'Feriados de ' + C.anioFeriados + ' actualizados',
          alConfirmar: function (res) {
            olvidarCache('config.feriados');
            if (typeof olvidarAgendas === 'function') olvidarAgendas();
            recargarConfig();
            avisar('Faltan los puentes turísticos: se cargan a mano.', 'error');
          }
        });
      });
    }
    $$('#cfg-cuerpo td.acciones button').forEach(function (b) {
      b.addEventListener('click', function () {
        formFeriado(r.feriados.filter(function (f) { return f.id === b.dataset.id; })[0]);
      });
    });
  }).catch(function (err) {
    if (!vigente(gen)) return;
    mostrarError(err, cont, function () { recargarConfig(); });
  });
}

/** Día de la semana 1..7 (lunes = 1) de una fecha AAAA-MM-DD. */
function diaSemanaDe(fecha) {
  var p = String(fecha).split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])).getDay();
  return d === 0 ? 7 : d;
}

function formFeriado(f) {
  var idem = nuevaIdem();
  abrirModal({
    titulo: f ? 'Editar feriado' : 'Nuevo día cerrado',
    cuerpo:
      '<div class="fila">' +
        '<div class="campo"><label for="f-fecha">Fecha</label>' +
          '<input type="date" id="f-fecha" style="width:100%" value="' +
          txt(f ? f.fecha : '') + '"></div>' +
        '<div class="campo"><label for="f-nombre">Motivo</label>' +
          '<input type="text" id="f-nombre" style="width:100%" value="' +
          txt(f ? f.nombre : '') + '" placeholder="Puente turístico, feriado provincial…">' +
        '</div>' +
      '</div>' +
      (f ? '<div class="campo"><label><input type="checkbox" id="f-activo"' +
           (f.activo ? ' checked' : '') + '> El centro cierra ese día</label>' +
           '<div class="ayuda">Desmarcado, el día vuelve a ser laborable. Nada se borra.</div>' +
           '</div>' : ''),
    textoAceptar: 'Guardar',
    alAceptar: function () {
      var datos = {
        idem: idem, fecha: valorModal('f-fecha'), nombre: valorModal('f-nombre'),
        activo: f ? valorModal('f-activo') : true
      };
      if (f) { datos.id = f.id; datos.version = f.version; }
      if (!datos.fecha || !datos.nombre) {
        throw { codigo: 'CAMPOS_FALTANTES', mensaje: 'Hacen falta la fecha y el motivo.' };
      }
      return guardarFeriado(datos);
    }
  });
}

function guardarFeriado(datos) {
  return llamar('config.feriado.guardar', datos)
    .then(function (r) { alGuardarFeriado(r); })
    .catch(function (err) {
      if (err.codigo !== 'IMPACTO_PENDIENTE') throw err;
      // Cerrar un día que ya tiene turnos NO los cancela. Se muestran y se
      // pide confirmar, igual que al cambiar un horario de atención.
      var af = (err.datos && err.datos.afectados) || [];
      abrirModal({
        titulo: 'Ese día ya tiene turnos dados',
        ancho: 620,
        cuerpo:
          '<div class="caja aviso"><h3>' + af.length + ' turno(s) para ese día</h3>' +
          '<p><b>No se van a cancelar.</b> Van a seguir existiendo y vas a verlos en la ' +
          'agenda de ese día, marcados, para reprogramarlos uno por uno.</p></div>' +
          '<div class="tabla-cont"><table><thead><tr><th>Hora</th><th>Profesional</th>' +
          '<th>Paciente</th><th>Turno</th></tr></thead><tbody>' +
          af.map(function (t) {
            return '<tr><td class="num">' + txt(t.hora) + '</td>' +
              '<td>' + txt(nombreMedico(t.medico_id)) + '</td>' +
              '<td>' + txt(t.paciente) + '</td>' +
              '<td class="num">' + txt(t.nro_turno) + '</td></tr>';
          }).join('') + '</tbody></table></div>',
        textoAceptar: 'Entiendo, cerrar el día igual',
        alAceptar: function () {
          datos.confirmado = true;
          return llamar('config.feriado.guardar', datos).then(alGuardarFeriado);
        }
      });
      return false;
    });
}

function alGuardarFeriado(r) {
  avisar('Calendario actualizado');
  olvidarCache('config.feriados');
  // La agenda cambia: lo que había en el navegador ya no vale.
  if (typeof olvidarAgendas === 'function') olvidarAgendas();
  recargarConfig();
}

// ================================================================ velocidad

/**
 * Mide los pedidos representativos y muestra el desglose en pantalla.
 *
 * Existe porque pedirle a alguien que abra la consola del navegador y copie
 * una línea es una barrera real: se termina discutiendo la lentitud sin
 * números. Acá se aprieta un botón y sale una tabla que se puede sacar como
 * captura de pantalla.
 */
function pintarVelocidad(cont) {
  cont.innerHTML =
    '<section class="bloque"><h2>Velocidad' +
      '<span class="der"><button class="btn principal chico" id="v-medir">Medir ahora</button></span>' +
    '</h2>' +
    '<div class="caja"><p>Esta prueba manda cuatro pedidos reales y muestra en qué se ' +
    'fue el tiempo de cada uno:</p>' +
    '<ul><li><b>trabajo</b> — leer las planillas, validar, calcular.</li>' +
    '<li><b>salto</b> — abrir la conexión contra un segundo proyecto de Apps Script y ' +
    'arrancarlo. <b>Con la pantalla nueva esto es 0</b>: ese salto ya no existe.</li>' +
    '<li><b>viaje</b> — arrancar la ejecución y volver al navegador.</li>' +
    '<li><b>cola</b> — cuánto esperó su turno detrás de otros pedidos. No es tiempo ' +
    'de servidor.</li></ul>' +
    '<p>Si el trabajo es la parte grande, hay algo que optimizar del lado del servidor. ' +
    'Si lo son el salto y el viaje, el costo es de la plataforma y lo único que baja ' +
    'el tiempo es hacer menos pedidos. Si es la cola, sobran pedidos en vuelo.</p></div>' +
    '<div id="v-resultado"></div>' +
    bloqueVersion() +
    '</section>';

  $('v-medir').addEventListener('click', medirVelocidad);
}

/**
 * La versión desplegada y el último pedido medido.
 *
 * Vivían en la cabecera, a la vista todo el día. No hacía falta: son datos de
 * mantenimiento, no de mostrador. Acá están cuando se los busca —que es
 * cuando alguien pregunta "¿qué versión tenés?" por teléfono— y no molestan
 * el resto del tiempo.
 */
function bloqueVersion() {
  var b = S.build || {};
  var t = S.tiempos;
  return '<div class="caja" style="margin-top:14px">' +
    '<h3>Versión y último pedido</h3>' +
    '<div class="tabla-cont"><table><tbody>' +
    '<tr><td class="rotulo-dato">Pantalla (PORTAL)</td><td class="dato">' +
      txt(b.portal || '—') + '</td></tr>' +
    '<tr><td class="rotulo-dato">Servidor (NÚCLEO)</td><td class="dato">' +
      txt(b.nucleo || '—') +
      (b.nucleo && !b.coinciden
        ? ' <span class="pill no">no coinciden · corré ACTUALIZAR.bat</span>' : '') +
      '</td></tr>' +
    '<tr><td class="rotulo-dato">Último pedido</td><td class="dato">' +
      (t ? txt(t.accion + ' · ' + t.total + ' ms (' + t.nucleo + ' trabajo + ' +
               t.salto + ' salto + ' + t.viaje + ' viaje)')
         : 'Todavía no se midió nada en esta pantalla.') +
      '</td></tr>' +
    '</tbody></table></div></div>';
}

function medirVelocidad() {
  var hoy = S.sesion.hoy || hoyLocal();
  var medicoId = (S.sesion.catalogos.medicos[0] || {}).id;
  var pruebas = [
    ['Entrar al sistema', 'sesion.iniciar', {}],
    ['Agenda de un día', 'agenda.dia', { medico_id: medicoId, fecha: hoy }],
    ['Agenda de dos semanas', 'agenda.rango', { medico_id: medicoId, desde: hoy, dias: 14 }],
    ['Toda la configuración', 'config.todo', {}],
    // ================================================================
    //  UNA ESCRITURA DE VERDAD, y por eso ésta y no otra.
    //
    //  Guardar cuesta bastante más que leer —toma el candado, escribe en la
    //  planilla de datos Y en la de auditoría, que es un segundo archivo— y
    //  hasta ahora esta pantalla solo medía lecturas. Optimizar el guardado
    //  sin un número era volver a adivinar.
    //
    //  Se mide `sesion.ingreso` porque recorre el camino completo de
    //  escritura y no inventa datos: lo único que hace es registrar que
    //  entraste, que es lo que acaba de pasar de verdad.
    // ================================================================
    ['Guardar (escritura real)', 'sesion.ingreso', { idem: nuevaIdem() }]
  ].filter(function (p) { return p[1] !== 'agenda.dia' || medicoId; });

  var filas = [];
  $('v-medir').disabled = true;
  $('v-resultado').innerHTML = '<div class="cargando">Midiendo…</div>';

  // De a uno y en orden: medir varios a la vez mide la cola, no los pedidos.
  function siguiente(i) {
    if (i >= pruebas.length) return Promise.resolve();
    var p = pruebas[i];
    return llamar(p[1], p[2])
      .then(function () {
        var t = S.tiempos || {};
        // El total es el del pedido en sí. La espera en cola va aparte: si se
        // sumara, un pedido que esperó su turno parecería lentísimo y el
        // problema estaría en otro lado.
        filas.push({ que: p[0], total: t.total || 0, nucleo: t.nucleo || 0,
                     salto: t.salto || 0, viaje: t.viaje || 0,
                     espera: t.espera || 0, perfil: t.perfil || [] });
      })
      .catch(function (err) {
        filas.push({ que: p[0], error: err.codigo || 'error' });
      })
      .then(function () { return siguiente(i + 1); });
  }

  siguiente(0).then(function () {
    $('v-medir').disabled = false;
    $('v-resultado').innerHTML =
      '<div class="tabla-cont"><table><thead><tr><th>Pedido</th><th>Total</th>' +
      '<th>Trabajo</th><th>Salto</th><th>Viaje</th><th>Cola</th></tr></thead><tbody>' +
      filas.map(function (f) {
        if (f.error) {
          return '<tr><td>' + txt(f.que) + '</td><td colspan="5">' + txt(f.error) + '</td></tr>';
        }
        return '<tr><td>' + txt(f.que) + '</td>' +
          '<td class="num"><b>' + (f.total / 1000).toFixed(1) + ' s</b></td>' +
          '<td class="num">' + f.nucleo + ' ms</td>' +
          '<td class="num">' + f.salto + ' ms</td>' +
          '<td class="num">' + f.viaje + ' ms</td>' +
          '<td class="num">' + (f.espera > 200 ? f.espera + ' ms' : '—') + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      detalleServidor(filas);
  });
}

/** Lo que pasó adentro del servidor, paso por paso, para el pedido más lento. */
function detalleServidor(filas) {
  var peor = null;
  filas.forEach(function (f) {
    if (!f.error && f.perfil && f.perfil.length && (!peor || f.nucleo > peor.nucleo)) peor = f;
  });
  if (!peor) return '';
  return '<h2 style="margin-top:16px">Adentro del servidor · ' + txt(peor.que) + '</h2>' +
    '<div class="tabla-cont"><table><thead><tr><th>Paso</th><th>Tiempo</th><th>Veces</th>' +

function formCatalogo(catalogo, fila) {
  var def = TITULOS_CAT[catalogo];
  var cuerpo = def.campos.map(function (c) {
    return '<div class="campo"><label for="f-' + c.k + '">' + txt(c.e) +
      (c.req ? '' : ' <span style="color:var(--faint)">(opcional)</span>') + '</label>' +
      '<input type="' + (c.tipo || 'text') + '" id="f-' + c.k + '" style="width:100%" value="' +
      txt(fila ? fila[c.k] : '') + '"></div>';
  }).join('');

  if (fila) {
    cuerpo += '<div class="campo"><label><input type="checkbox" id="f-activo"' +
      (fila.activo ? ' checked' : '') + '> Activo</label>' +
      '<div class="ayuda">Desactivar no borra nada. Si está en uso, el sistema lo va a impedir ' +
      'y va a decir dónde.</div></div>';
  }

  var idem = nuevaIdem();
  abrirModal({
    titulo: (fila ? 'Editar ' : 'Nueva ') + def.singular,
    cuerpo: cuerpo,
    textoAceptar: 'Guardar',
    alAceptar: function () {
      var datos = { catalogo: catalogo, idem: idem };
      def.campos.forEach(function (c) { datos[c.k] = valorModal('f-' + c.k); });
      if (fila) { datos.id = fila.id; datos.version = fila.version; datos.activo = valorModal('f-activo'); }

      guardarSinEsperar({
        accion: 'config.catalogo.guardar', datos: datos,
        ok: fila ? 'Cambios guardados' : 'Agregado',
        aplicar: function () {
          return aplicarLocal('config.catalogo.listar', { catalogo: catalogo }, function (l) {
            var o = { id: fila ? fila.id : 'nuevo-' + idem,
                      activo: fila ? (datos.activo === true) : true,
                      version: fila ? fila.version : 1 };
            def.campos.forEach(function (c) { o[c.k] = datos[c.k]; });
            ponerEnLista(l.filas, o);

        alConfirmar: function (r) { aplicarRespuesta(r); recargarConfig(); }

}

          }).join('') + '</select></div>' +
      '<div class="campo"><label for="f-consultorio">Consultorio ' +
        '<span style="color:var(--faint)">(opcional)</span></label>' +
        '<select id="f-consultorio" style="width:100%">' +
          opciones(S.sesion.catalogos.consultorios, p ? p.consultorio_id : '',
                   null, 'Sin asignar') +
        '</select>' +
        '<div class="ayuda">Solo si este profesional atiende siempre en el mismo. ' +
        'Dejalo sin asignar si suele cambiar: el consultorio se puede indicar ' +
        'después en cada turno.</div></div>' +
    '</div>' +
    '<div class="fila">' +
      '<div class="campo"><label for="f-desde">Desde</label>' +
        '<input type="time" id="f-desde" style="width:100%" step="300" value="' +
        txt(p ? p.hora_inicio : '08:00') + '"></div>' +
      '<div class="campo"><label for="f-hasta">Hasta</label>' +
        '<input type="time" id="f-hasta" style="width:100%" step="300" value="' +
        txt(p ? p.hora_fin : '12:00') + '"></div>' +
      '<div class="campo"><label for="f-duracion">Minutos por turno</label>' +
        '<input type="number" id="f-duracion" style="width:100%" min="5" max="120" step="5" value="' +
        txt(p ? p.duracion_min : 20) + '"></div>' +
    '</div>' +
    '<div class="campo"><label for="f-vigencia">' + (p ? 'El cambio rige desde' : 'Rige desde') + '</label>' +
      '<input type="date" id="f-vigencia" style="width:100%" value="' + txt(hoy) + '">' +
      (p ? '<div class="ayuda">El bloque actual se cierra el día anterior a esta fecha.</div>' : '') +
    '</div>' +
    '<div id="f-previo" class="ayuda"></div>';

  abrirModal({
    titulo: p ? 'Cambiar horario' : 'Nuevo bloque de atención',
    cuerpo: cuerpo,
    textoAceptar: 'Guardar',
    alAceptar: function () { guardarPlantilla(p, idem); }
  });

  function recalcular() {
    var ini = valorModal('f-desde'), fin = valorModal('f-hasta'), dur = Number(valorModal('f-duracion'));
    var mIni = Number(ini.split(':')[0]) * 60 + Number(ini.split(':')[1] || 0);
    var mFin = Number(fin.split(':')[0]) * 60 + Number(fin.split(':')[1] || 0);
    var n = (dur > 0 && mFin > mIni) ? Math.floor((mFin - mIni) / dur) : 0;
    var sobra = (dur > 0 && mFin > mIni) ? (mFin - mIni) % dur : 0;
    $('f-previo').innerHTML = n
      ? 'Genera <b>' + n + ' turnos</b> por día.' +
        (sobra ? ' Sobran ' + sobra + ' minutos al final, que se descartan.' : '')
      : 'Con estos valores no se genera ningún turno.';
  }
  ['f-desde','f-hasta','f-duracion'].forEach(function (id) {
    $(id).addEventListener('input', recalcular);
  });
  recalcular();
}

/**
 * Antes de guardar se consulta el impacto y, si hay turnos que quedarian
 * fuera, se pide confirmacion explicita mostrando cuales. Nada se cancela
 * en cascada: administracion decide despues turno por turno.
 */
function guardarPlantilla(p, idem) {
  var datos = {
    idem: idem,
    medico_id: C.medicoId,
    dia_semana: Number(valorModal('f-dia')),
    hora_inicio: valorModal('f-desde'),
    hora_fin: valorModal('f-hasta'),
    duracion_min: Number(valorModal('f-duracion')),
    consultorio_id: valorModal('f-consultorio'),
    vigencia_desde: valorModal('f-vigencia')
  };
  if (p) { datos.id = p.id; datos.version = p.version; }

  // Un solo viaje, y sin bloquear la pantalla. Si hay turnos que quedarian
  // fuera, el servidor no escribe nada y los devuelve en el error; recien ahi
  // se pregunta y se reenvia confirmado. Antes esto costaba un pedido de
  // impacto ANTES de cada guardado, aunque casi nunca hubiera nada afectado.
  grabarPlantilla(datos, p, function (err) {
    if (err.codigo !== 'IMPACTO_PENDIENTE') return false;   // que lo maneje el aviso comun
    var imp = err.datos || { afectados: [] };

    // Hay turnos que quedarian fuera: se muestran y se pide confirmar.
    abrirModal({
      titulo: 'Hay turnos que quedarían fuera',
      ancho: 620,
      cuerpo:
        '<div class="caja aviso"><h3>' + imp.afectados.length +
          ' turno(s) quedarían fuera del nuevo horario</h3>' +
          '<p><b>No se van a cancelar.</b> Van a seguir existiendo y vas a verlos marcados en la ' +
          'agenda, para reprogramarlos uno por uno.</p></div>' +
        '<div class="tabla-cont"><table><thead><tr><th>Fecha</th><th>Hora</th>' +
        '<th>Paciente</th><th>Turno</th></tr></thead><tbody>' +
        imp.afectados.map(function (t) {
          return '<tr><td class="num">' + txt(fechaCorta(t.fecha)) + '</td>' +
                 '<td class="num">' + txt(t.hora) + '</td>' +
                 '<td>' + txt(t.paciente) + '</td>' +
                 '<td class="num">' + txt(t.nro_turno) + '</td></tr>';
        }).join('') + '</tbody></table></div>',
      textoAceptar: 'Entiendo, guardar igual',
      alAceptar: function () {
        datos.confirmado = true;
        grabarPlantilla(datos, p);
      }
    });
    return true;      // manejado: no hace falta el aviso de error
  });
}

/**
 * @param alFallar (opcional) devuelve true si ya se ocupó del error.
 */
function grabarPlantilla(datos, p, alFallar) {
  guardarSinEsperar({
    accion: 'config.plantilla.guardar', datos: datos,
    alConfirmar: function (r) {
      avisar((p ? 'Horario actualizado' : 'Bloque agregado') + ' · ' +
             r.franjas + ' turnos por día');
      aplicarRespuesta(r);
      recargarConfig();
    },
    alFallar: alFallar
  });
}

/**
 * Guarda lo que el servidor devolvio junto con el guardado, para que la
 * pantalla se redibuje sin volver a preguntar.
 *
 * Cada pedido cuesta segundos, asi que la diferencia entre uno y tres es la
 * diferencia entre que guardar se sienta inmediato o que parezca colgado.
 */
function aplicarRespuesta(r) {
  // Se reemplaza SOLO la lista que cambió. Antes se tiraba todo lo de
  // configuración, y por eso la solapa siguiente a un guardado volvía a
  // costar un pedido entero.
  if (r && r.catalogos) S.sesion.catalogos = r.catalogos;
  // La respuesta dice de qué lista se trata. Deducirlo de lo que la pantalla
  // está mostrando fallaría si la persona cambió de solapa mientras guardaba.
  if (r && r.filas)     guardarEnCache('config.catalogo.listar',
                                       { catalogo: r.catalogo },
                                       { catalogo: r.catalogo, filas: r.filas });
  if (r && r.medicos)   guardarEnCache('config.medicos.listar', {}, { medicos: r.medicos });
  if (r && r.plantillas) guardarEnCache('config.plantillas.listar',
                                        { medico_id: r.plantillas_de },
                                        { plantillas: r.plantillas });
  if (r && r.usuarios)  guardarEnCache('config.usuarios.listar', {},
                                       { usuarios: r.usuarios,
                                         roles_disponibles: r.roles_disponibles });
  // Los horarios cambian lo que muestra la agenda: lo guardado alli ya no vale.
  if (r && r.plantillas && typeof olvidarAgendas === 'function') olvidarAgendas();
}

function confirmarBajaPlantilla(p) {
  abrirModal({
    titulo: 'Quitar bloque de atención',
    cuerpo: '<p>Se va a dejar de ofrecer <b>' + txt(DIAS_SEMANA[p.dia_semana] + ' de ' +
            p.hora_inicio + ' a ' + p.hora_fin) + '</b>.</p>' +
            '<div class="caja aviso"><p>Los turnos ya reservados en ese horario ' +
            '<b>no se cancelan</b>: van a aparecer marcados en la agenda para que los ' +
            'reprogrames.</p></div>',
    textoAceptar: 'Quitar',
    alAceptar: function () {

        ok: 'Bloque quitado',

      });

}

function pintarUsuarios(cont) {

function formUsuario(u, roles) {
  var cuerpo =
    '<div class="campo"><label for="f-email">Correo de Google</label>' +
      '<input type="email" id="f-email" style="width:100%" value="' + txt(u ? u.email : '') + '"' +

      (u ? '' : '<div class="ayuda">Tiene que ser la cuenta con la que la persona va a entrar. ' +

    '</div>' +
    '<div class="fila">' +
      '<div class="campo"><label for="f-nombre">Nombre</label>' +
        '<input type="text" id="f-nombre" style="width:100%" value="' + txt(u ? u.nombre : '') + '"></div>' +
      '<div class="campo"><label for="f-apellido">Apellido</label>' +
        '<input type="text" id="f-apellido" style="width:100%" value="' + txt(u ? u.apellido : '') + '"></div>' +
    '</div>' +
    '<div class="campo"><label>Roles</label>' +
      roles.map(function (rol) {
        return '<label style="display:block;margin:4px 0;color:var(--ink)">' +
          '<input type="checkbox" class="rol" value="' + txt(rol) + '"' +
          (u && u.roles.indexOf(rol) >= 0 ? ' checked' : '') + '> ' +
          txt(ETIQUETA_ROL[rol] || rol) + '</label>';
      }).join('') +
      '<div class="ayuda">Al menos uno. Los permisos de todos los roles marcados se suman.</div>' +
    '</div>' +
    '<div class="campo" id="f-medico-caja">' +
      '<label for="f-medico">Profesional Asociado</label>' +
      '<select id="f-medico" style="width:100%">' +
        opciones(S.sesion.catalogos.medicos, u ? u.medico_id : '',
                 function (m) { return m.apellido + ', ' + m.nombre; }, 'Elegir…') +
      '</select>' +
      '<div class="ayuda">Obligatorio con el rol Profesional: sin esto, «Mi agenda» no sabe qué mostrar.</div>' +
    '</div>' +
    '<div class="campo"><label><input type="checkbox" id="f-activo"' +
      (!u || u.activo ? ' checked' : '') + '> Activo</label>' +
      '<div class="ayuda">Desmarcar bloquea el ingreso de inmediato. La fila no se borra nunca.</div>' +
    '</div>';

  var idem = nuevaIdem();
  abrirModal({
    titulo: u ? 'Editar usuario' : 'Nuevo usuario',
    cuerpo: cuerpo,
    textoAceptar: 'Guardar',
    alAceptar: function () {
      var elegidos = $$('.rol').filter(function (c) { return c.checked; })
                               .map(function (c) { return c.value; });
      var datos = {
        idem: idem,
        email: valorModal('f-email'),
        nombre: valorModal('f-nombre'),
        apellido: valorModal('f-apellido'),
        roles: elegidos,
        medico_id: valorModal('f-medico'),
        activo: valorModal('f-activo'),
        version: u ? u.version : undefined
      };

      guardarSinEsperar({
        accion: 'config.usuarios.guardar', datos: datos,
        ok: u ? 'Cambios guardados' : 'Usuario dado de alta',
        aplicar: function () {
          return aplicarLocal('config.usuarios.listar', {}, function (l) {
            ponerEnLista(l.usuarios, {
              id: u ? u.id : 'nuevo-' + idem,
              email: datos.email, nombre: datos.nombre, apellido: datos.apellido,
              roles: elegidos, medico_id: datos.medico_id,
              activo: datos.activo === true,
              ultimo_acceso: u ? u.ultimo_acceso : '',
              version: u ? u.version : 1
            });
          });
        },
        alConfirmar: function (r) { aplicarRespuesta(r); recargarConfig(); }
      });
    }
  });

  // El desplegable de medico solo tiene sentido con el rol Medico marcado.
  function ajustar() {
    var hayMedico = $$('.rol').some(function (c) { return c.checked && c.value === 'MEDICO'; });
    $('f-medico-caja').style.display = hayMedico ? '' : 'none';
  }
  $$('.rol').forEach(function (c) { c.addEventListener('change', ajustar); });
  ajustar();
}
